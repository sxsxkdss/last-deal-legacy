<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAST DEAL</title>
<meta name="description" content="LAST DEAL: a two-sided card game played in a back room under a casino. Day on the floor, night in the back room. Play friends online, no account needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*STYLE*/
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.3" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="start" class="screen">
  <div class="page">
    <h1 class="title">Last<br><span>Deal</span></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="field"><span class="label" data-i18n="language"></span><div class="seg" id="segLang"></div></div>
    <div class="field"><span class="label" data-i18n="name"></span><input id="pname" type="text" maxlength="14" value="Player"></div>
    <div class="section"><button class="btn primary wide" id="btnCreate" data-i18n="createRoom"></button></div>
    <div class="section">
      <span class="label" data-i18n="haveCode"></span>
      <div class="actions-row">
        <input id="joinCode" class="code-in" type="text" maxlength="4" placeholder="CODE" data-i18n-ph="codePh" autocomplete="off">
        <button class="btn" id="btnJoin" data-i18n="joinRoom"></button>
      </div>
    </div>
    <div class="msg" id="startMsg"></div>
    <button class="textlink" data-rules data-i18n="howTo"></button> <button class="textlink" data-settings data-i18n="settings"></button>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="page">
    <span class="label" data-i18n="roomCode"></span>
    <div class="code" id="lbCode" title="Copy code">----</div>
    <p class="lede" id="lbHint" style="margin:8px 0 24px"></p>
    <div class="actions-row" id="shareBox" style="margin-bottom:24px"><input type="text" id="shareLink" readonly style="flex:1"><button class="btn" id="btnCopyLink" data-i18n="copyLink"></button></div>
    <div class="field"><span class="label" data-i18n="yourName"></span><input id="lbName" type="text" maxlength="14"></div>
    <div class="section"><span class="label" data-i18n="players"></span><div id="lbSeats" style="margin-top:8px"></div></div>
    <div id="lbHost">
      <div class="section actions-row"><button class="btn" id="btnAddBot" data-i18n="addBot"></button><button class="btn" id="btnRmBot" data-i18n="rmBot"></button></div>
      <div class="section"><button class="btn primary wide" id="btnRoomStart" data-i18n="startGame"></button></div>
      <div class="section"><span class="label" data-i18n="matchMode"></span>
        <div class="modes" id="lbMode"></div>
        <div class="limitrow" id="lbLimitRow"><span class="label" data-i18n="debtLimit"></span><div class="seg" id="lbLimit"></div></div></div>
      <div class="section"><span class="label" data-i18n="presets"></span><div class="presets" id="lbPresets"></div>
        <details class="fine" id="lbFine"><summary id="lbFineSum"></summary>
          <span class="label sublabel" data-i18n="rules"></span><div id="lbRules"></div>
          <span class="label sublabel" data-i18n="extraCards"></span><div id="lbCards"></div>
        </details></div>
    </div>
    <div id="lbGuest" class="section hidden"><span class="label" data-i18n="tableRules"></span><div id="lbRulesView" style="margin-top:8px"></div></div>
    <div class="msg" id="lbWait"></div>
    <button class="textlink" id="btnLeave" data-i18n="leaveRoom"></button>
  </div>
</div>

<div id="game" class="hidden">
  <div id="horseBar" class="hidden"></div>
  <div id="opps"></div>
  <div id="table">
    <div id="banner"></div>
    <div id="toast"></div>
    <div class="center" id="center">
      <div class="piles">
        <div class="pile" id="drawpile" ></div>
        <div class="pile" id="discard"></div>
      </div>
      <div class="hud" id="hud"></div>
    </div>
  </div>
  <div id="bottom">
    <div class="me">
      <div class="who"><span class="ini" id="meIni"></span><span id="meName"></span><span class="cnt" id="meCnt"></span><span class="tags label" id="meTags"></span><span id="meDeals"></span></div>
      <div class="abbar hidden" id="abBar"></div>
      <div class="invbar hidden" id="invBar"></div>
      <div class="colbar hidden" id="colBar"><span class="label" id="colTxt"></span><button class="btn" id="btnColGive"></button><button class="btn" id="btnColLever"></button></div>
        <div class="actions">
        <button class="btn" id="btnPass" data-i18n="pass"></button>
        <button class="btn gamble hidden" id="btnGamble"></button>
        <button class="btn quiet mob" id="btnSelect"></button>
        <button class="btn quiet desk" id="btnSort">Sort</button>
        <button class="btn quiet desk" data-rules data-i18n="rules"></button>
        <button class="btn quiet desk" id="btnQuit">Quit</button>
        <button class="btn mob" id="btnMenu" data-i18n="menu"></button>
      </div>
    </div>
    <div id="ticker"></div>
    <div id="selBar" class="selbar hidden"></div>
    <div id="hand"></div>
  </div>
  <div id="side"><div class="sidehead"><span class="label" data-i18n="log"></span><span class="label" id="netTag"></span><button class="btn quiet" id="btnFx"></button><button class="btn quiet" id="btnSound">Sound on</button></div><div id="log"></div><div id="comboRef"></div></div>
</div>

<div id="netBanner" class="hidden"></div>
<canvas id="fxc" aria-hidden="true"></canvas>
<div id="slot" class="hidden" aria-live="polite"></div>
<div id="crt" aria-hidden="true"></div><div id="grain" aria-hidden="true"></div>
<div id="fx"></div>
<div id="modal" class="modal hidden"><div class="dialog" id="modalBody"></div></div>
<button id="modalBack" class="modalback hidden" data-i18n="modalBack"></button>

<script>
/*ENGINE*/
</script>
<script>
/*CONTROLLER*/
</script>
<div id="curseDark" class="hidden"></div><div id="curseStatic" class="hidden"></div><div id="horsePop" class="hidden"></div><div id="warClock" class="hidden"></div>
</body>
</html>
