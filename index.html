// ---------- card tooltip: name + what it does, on hover (mouse) or long-press (touch) ----------
const TIP = (() => {
  const el = document.createElement('div'); el.id = 'cardtip'; el.setAttribute('role', 'tooltip'); document.body.appendChild(el);
  let cur = null, pressT = 0, suppressClick = false;
  const faceOf = card => { const [side, c, v] = (card.dataset.f || '').split('|'); return v ? { side, f: { c, v } } : null; };
  function show(card) {
    const d = faceOf(card); if (!d || dragging || S.tips === false) return;
    cur = card;
    const side = d.side === 'D' ? t('tDark') : t('tLight');
    el.innerHTML = `<b>${esc(cardName(d.f))}</b><span class="tipside">${esc(side)}</span>${cardDesc(d.f) ? `<p>${esc(cardDesc(d.f))}</p>` : ''}`;
    el.className = 'show s-' + d.side;
    const r = card.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let x = r.left + r.width / 2 - w / 2, y = r.top - h - 10;
    if (y < 6) y = r.bottom + 10;
    x = Math.max(6, Math.min(innerWidth - w - 6, x));
    el.style.left = x + 'px'; el.style.top = Math.min(innerHeight - h - 6, y) + 'px';
  }
  function hide() { cur = null; el.className = ''; }
  document.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    if (dragging || document.querySelector('.pick.reorder')) { if (cur) hide(); return; }
    const card = e.target.closest && e.target.closest('.card[data-f]');
    if (card && card !== cur) show(card); else if (!card && cur) hide();
  });
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') { hide(); return; }
    const card = e.target.closest && e.target.closest('.card[data-f]');
    clearTimeout(pressT); hide();
    if (card) { const x0 = e.clientX, y0 = e.clientY; pressT = setTimeout(() => { show(card); suppressClick = true; }, 450);
      const mv = ev => { if (Math.hypot(ev.clientX - x0, ev.clientY - y0) > 8) { clearTimeout(pressT); document.removeEventListener('pointermove', mv, true); } };
      document.addEventListener('pointermove', mv, true); setTimeout(() => document.removeEventListener('pointermove', mv, true), 600); }
  }, true);
  document.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') hide(); }, true);
  const end = () => { clearTimeout(pressT); if (cur && suppressClick) setTimeout(hide, 1600); };
  document.addEventListener('pointerup', end, true);
  document.addEventListener('pointercancel', end, true);
  // a long-press to read a card must not also play it
  document.addEventListener('click', e => { if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.card[data-f]')) e.preventDefault(); });
  addEventListener('scroll', hide, true);
  return { hide };
})();

// ================= AMBIENT: the room you play in =================
// 'house' = a synthesized back-room hum (or the asset pack's music file), 'youtube' = a YouTube video playing hidden.
const AMB = {
  nodes: null, yt: null, side: 'L',
  ytId(url) { const m = String(url || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(url || '') ? url : 'hFBn_Ro9y7I'); },
  apply() {
    const want = S.sound ? S.ambient : 'off';
    if (want !== 'house') this.stopHouse();
    if (want !== 'youtube') this.stopYT();
    if (want === 'house') { if (ASSETS.manifest && ASSETS.manifest.sounds && ASSETS.manifest.sounds.music) return; this.startHouse(); }
    if (want === 'youtube') this.startYT();
  },
  // a low drone, a slow murmur and vinyl crackle; brighter by day, heavier at night
  startHouse() {
    if (this.nodes || !SFX.ctx) return;
    const c = SFX.ctx, out = c.createGain(); out.gain.value = 0; out.connect(c.destination);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(out);
    const oscs = [55, 55.4, 82.4, 110.2].map((f, i) => { const o = c.createOscillator(); o.type = i < 2 ? 'sawtooth' : 'triangle'; o.frequency.value = f; const g = c.createGain(); g.gain.value = i < 2 ? 0.05 : 0.03; o.connect(g); g.connect(lp); o.start(); return o; });
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 140; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const mur = c.createBufferSource(); mur.buffer = SFX.noise; mur.loop = true;
    const mf = c.createBiquadFilter(); mf.type = 'bandpass'; mf.frequency.value = 520; mf.Q.value = 0.8;
    const mg = c.createGain(); mg.gain.value = 0.05; mur.connect(mf); mf.connect(mg); mg.connect(out); mur.start();
    const crackle = setInterval(() => { if (!this.nodes || !S.sound) return; if (Math.random() < 0.5) SFX.rustle(c.currentTime + Math.random() * 0.2, 0.01, 3000 + Math.random() * 3000, 2000, 4, 0.03 * (S.ambVol ?? 0.35)); }, 180);
    this.nodes = { out, lp, oscs, lfo, mur, mf, crackle };
    this.setSide(this.side); this.volume();
  },
  stopHouse() {
    if (!this.nodes) return; const n = this.nodes; this.nodes = null; clearInterval(n.crackle);
    try { n.out.gain.setTargetAtTime(0, SFX.ctx.currentTime, 0.3); setTimeout(() => { n.oscs.forEach(o => o.stop()); n.lfo.stop(); n.mur.stop(); n.out.disconnect(); }, 1200); } catch (e) {}
  },
  startYT() {
    if (this.yt) { this.volume(); return; }
    const id = this.ytId(S.ytUrl), f = document.createElement('iframe');
    f.src = `https://www.youtube.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&controls=0&enablejsapi=1&playsinline=1`;
    f.allow = 'autoplay; encrypted-media'; f.title = 'ambient'; f.tabIndex = -1;
    Object.assign(f.style, { position: 'fixed', width: '1px', height: '1px', left: '-10px', bottom: '-10px', opacity: '0', pointerEvents: 'none', border: '0' });
    document.body.appendChild(f); this.yt = f;
    f.addEventListener('load', () => setTimeout(() => this.volume(), 800));
  },
  stopYT() { if (this.yt) { this.yt.remove(); this.yt = null; } },
  volume() {
    const v = S.ambVol ?? 0.35;
    if (this.nodes) this.nodes.out.gain.setTargetAtTime(v * 1.4, SFX.ctx.currentTime, 0.4);
    if (this.yt && this.yt.contentWindow) this.yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [Math.round(v * 100)] }), '*');
  },
  setSide(side) {
    this.side = side;
    if (!this.nodes) return;
    const night = side === 'D', t0 = SFX.ctx.currentTime;
    this.nodes.lp.frequency.setTargetAtTime(night ? 260 : 520, t0, 1.2);
    this.nodes.mf.frequency.setTargetAtTime(night ? 300 : 700, t0, 1.2);
    this.nodes.oscs.forEach((o, i) => o.detune.setTargetAtTime(night ? -300 : 0, t0, 1.5)); // a minor third down at night
  }
};

  const slider = (id, val) => `<input type="range" id="${id}" min="0" max="100" value="${Math.round((val ?? 0.5) * 100)}">`;
  openModal(`<h2>${t('settings')}</h2><div class="settings">
    <div class="set"><span>${t('menuLang')}</span>${seg('stLang', LANG, Object.entries(LANGS))}</div>
    <div class="set"><span>${t('setSound')}</span>${seg('stSound', S.sound ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    <div class="set"><span>${t('setVolume')}</span>${slider('stVol', S.vol)}</div>
    <div class="set"><span>${t('setAmbient')}</span>${seg('stAmb', S.ambient, [['house', t('ambHouse')], ['youtube', 'YouTube'], ['off', t('off')]])}</div>
    <div class="set"><span>${t('setAmbVol')}</span>${slider('stAmbVol', S.ambVol)}</div>
    <div class="set ytrow ${S.ambient === 'youtube' ? '' : 'hidden'}"><span>${t('setYt')}</span><input type="text" id="stYt" placeholder="https://www.youtube.com/watch?v=hFBn_Ro9y7I" value="${esc(S.ytUrl || '')}"></div>
    <div class="set"><span>${t('menuFx')}</span>${seg('stFx', S.fx, [['full', t('fxFull')], ['lite', t('fxLite')]])}</div>
    <div class="set"><span>${t('setShake')}</span>${seg('stShake', S.shake !== false ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    <div class="set"><span>${t('setBg')}</span>${seg('stBg', S.bgMotion !== false ? 1 : 0, [[1, t('bgMoving')], [0, t('bgStill')]])}</div>
    <div class="set"><span>${t('setTips')}</span>${seg('stTips', S.tips !== false ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
  </div><button class="btn primary wide" id="stClose" style="margin-top:16px">${t('close')}</button>`);
  const bindSeg = (id, fn) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { fn(b.dataset.v); SFX.play('click'); showSettings(); });
  bindSeg('stLang', v => setLang(v));
  bindSeg('stSound', v => { S.sound = v === '1'; saveSettings(); if (S.sound) SFX.init(); $('btnSound').textContent = S.sound ? t('soundOn') : t('soundOff'); AMB.apply(); });
  bindSeg('stAmb', v => { S.ambient = v; saveSettings(); SFX.init(); AMB.apply(); });
  bindSeg('stFx', v => setFx(v));
  bindSeg('stShake', v => { S.shake = v === '1'; saveSettings(); });
  bindSeg('stBg', v => { S.bgMotion = v === '1'; saveSettings(); });
  bindSeg('stTips', v => { S.tips = v === '1'; saveSettings(); });
  $('stVol').oninput = e => { S.vol = e.target.value / 100; saveSettings(); if (SFX.master) SFX.master.gain.value = 0.9 * S.vol; };
  $('stVol').onchange = () => SFX.play('stack', 6);
  $('stAmbVol').oninput = e => { S.ambVol = e.target.value / 100; saveSettings(); AMB.volume(); };
  $('stYt').onchange = e => { S.ytUrl = e.target.value.trim(); saveSettings(); AMB.stopYT(); AMB.apply(); };
  $('stClose').onclick = closeModal;
}
document.querySelectorAll('[data-settings]').forEach(b => b.onclick = showSettings);

</script>
</body>
</html>
