<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO Flip · No Mercy</title>
<meta name="description" content="UNO Flip and No Mercy rules in the browser. Endless deck, stacking, light and dark sides. Play friends online, no account needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  /* one warm-neutral scale; the dark side shifts it two steps darker */
  --bg:#1a1a18; --s1:#222220; --s2:#2b2b28; --s3:#363632; --line:#3d3d39;
  --text:#f2f1ec; --muted:#9c9b94;
  --accent:#c8f03c; --accent-hi:#d6f86a; --on-accent:#141412;
  /* card colors are game content, not UI chrome */
  --r:#e2343d; --y:#f4c21b; --g:#23a352; --b:#2069d8;
  --p:#ff4aa5; --t:#17c6b6; --o:#ff8a22; --v:#9550ff;
  --ri:#c4202a; --yi:#a87a00; --gi:#147a3a; --bi:#1452b0;
  --paper:#fbfaf6; --ink:#141412;
  --frame:#ece7d8; /* table border: light side */
  --cw:clamp(58px, min(10.5vh, 7.5vw), 104px); --ch:calc(var(--cw) * 1.47);
  --ease:cubic-bezier(.2,.7,.3,1);
  --f-ui:'Archivo',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
body.dark{ --frame:var(--p); --bg:#0d0d0e; --s1:#151516; --s2:#1e1e20; --s3:#29292c; --line:#2f2f33; --muted:#8e8e94; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 14px/20px var(--f-ui);font-variation-settings:"wdth" 100;color:var(--text);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;transition:background-color 180ms ease-out}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
.mono{font-family:var(--f-mono)}
.label{font:500 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- controls ---------- */
.btn{height:40px;padding:0 16px;border-radius:4px;background:var(--s2);font-weight:600;font-size:14px;transition:background-color 150ms ease-out,transform 80ms ease-out,opacity 150ms ease-out;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--s3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-hi)}
.btn.quiet{background:transparent;color:var(--muted)}
.btn.quiet:hover:not(:disabled){background:var(--s2);color:var(--text)}
.btn.wide{width:100%;height:48px;font-size:16px}
.btn.uno.ready{background:var(--text);color:var(--bg)}
.btn.uno.called{background:var(--s3);color:var(--muted)}
input[type=text]{height:40px;padding:0 12px;border-radius:4px;background:var(--s1);border:1px solid var(--line);color:var(--text);font:inherit;outline:none;transition:border-color 150ms ease-out;min-width:0}
input[type=text]:focus{border-color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{height:32px;padding:0 12px;color:var(--muted);font:500 13px/32px var(--f-mono);transition:background-color 150ms ease-out,color 150ms ease-out}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--s3);color:var(--text)}

/* ---------- menu pages ---------- */
.screen{position:fixed;inset:0;overflow:auto}
.page{max-width:560px;margin:0 auto;padding:48px 24px}
.title{font:900 48px/44px var(--f-ui);font-variation-settings:"wdth" 70;text-transform:uppercase;letter-spacing:-.01em}
.title span{color:var(--muted)}
.lede{color:var(--muted);font-size:16px;line-height:24px;margin:16px 0 32px;max-width:440px}
.field{display:grid;grid-template-columns:136px 1fr;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.field>.label{align-self:center}
.section{margin-top:32px}
.section>.label{display:block;margin-bottom:8px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.opt input{width:16px;height:16px;margin-top:2px;accent-color:var(--text)}
.opt b{font-weight:600;display:block}
.opt span{color:var(--muted)}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code-in{width:96px;text-align:center;font:500 16px var(--f-mono);letter-spacing:.2em;text-transform:uppercase}
.msg{color:var(--muted);min-height:20px;margin-top:8px}
.textlink{color:var(--muted);text-decoration:underline;text-underline-offset:3px;margin-top:24px;display:inline-block}
.textlink:hover{color:var(--text)}
.rv{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.rv:last-child{border-bottom:1px solid var(--line)}
.rv .mono{color:var(--muted)}
.rv.off{color:var(--muted)}
.code{font:500 48px/56px var(--f-mono);letter-spacing:.24em;cursor:pointer}
.seatrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.seatrow:last-child{border-bottom:1px solid var(--line)}
.seatrow .who{display:flex;gap:8px;align-items:center;font-weight:600}
.seatrow.me .who{text-decoration:underline;text-underline-offset:4px}
.ini{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;background:var(--s3);font:500 11px var(--f-mono);color:var(--text);flex:none}
@media (max-width:520px){.field{grid-template-columns:1fr;gap:8px}.page{padding:32px 16px}.title{font-size:40px;line-height:38px}}

/* ---------- game layout ---------- */
#game{position:fixed;inset:0;border:6px solid var(--frame);transition:border-color 180ms ease-out;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 288px}
#opps,#table,#bottom,#hand{min-width:0}
#opps{grid-column:1;display:flex;justify-content:center;gap:8px;padding:16px 16px 0;flex-wrap:wrap}
#table{grid-column:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:0}
#side{grid-column:2;grid-row:1/4;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#bottom{grid-column:1;padding:0 16px 16px}

/* seats */
.opp{position:relative;width:auto;min-width:136px;max-width:220px;background:var(--s1);border:1px solid transparent;border-radius:4px;padding:8px 12px;transition:border-color 150ms ease-out,opacity 150ms ease-out}
.opp.turn{border-color:var(--text)}
.opp.out{opacity:.4}
.opp .top{display:flex;align-items:center;gap:8px}
.opp .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.opp .tags{text-align:right}
.opp .cnt{font:900 24px/24px var(--f-ui);font-variation-settings:"wdth" 75}
.opp .tags{font:500 11px/16px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.opp .tags b{color:var(--text);font-weight:500}
.fan{position:relative;height:16px;margin-top:8px}
.fan i{position:absolute;top:0;width:10px;height:16px;border-radius:2px}
.fan i.w{background:conic-gradient(var(--r) 0 90deg,var(--b) 0 180deg,var(--y) 0 270deg,var(--g) 0)}
.fan i.w.D{background:conic-gradient(var(--p) 0 90deg,var(--t) 0 180deg,var(--o) 0 270deg,var(--v) 0)}
.bar{height:2px;background:var(--s3);margin-top:8px}
.bar>div{height:100%;background:var(--muted);transition:width 180ms ease-out}
.bar.hot>div{background:var(--text)}
.timer{height:2px;margin-top:8px;background:var(--text);transform-origin:left;animation:timer linear forwards}
@keyframes timer{to{transform:scaleX(0)}}
.catch{margin-top:8px;width:100%;height:28px;font-size:12px}

/* table */
#banner{font-weight:500;color:var(--muted);text-align:center;min-height:20px}
#banner.you{color:var(--text);font-weight:700}
.center{display:flex;align-items:center;gap:48px;position:relative}
.piles{display:flex;align-items:center;gap:48px;position:relative;padding:20px 28px;border-radius:calc(var(--cw)*.5);background:var(--s1)}
.mob,#ticker{display:none}
html,body{touch-action:manipulation}
#dirRing{position:absolute;left:50%;top:50%;width:calc(100% + 96px);height:calc(100% + 72px);transform:translate(-50%,-50%);pointer-events:none;transition:transform 180ms ease-out;overflow:visible}
#dirRing.ccw{transform:translate(-50%,-50%) scaleX(-1)}
#dirRing path{fill:none;stroke:var(--s3);stroke-width:2}
#dirRing .head{fill:var(--muted);stroke:none}
.sep{align-self:center;font:500 20px/1 var(--f-mono);color:var(--muted);padding:0 2px}
.opp .next{color:var(--text)}
.dirtxt{font:500 13px/20px var(--f-mono)}
.pile{position:relative;width:calc(var(--cw)*1.3);height:calc(var(--ch)*1.3)}
.pile .card{position:absolute;inset:0;width:100%;height:100%}
#drawpile{cursor:pointer}
#drawpile .card:nth-child(1){transform:translate(-6px,6px);filter:brightness(.55)}
#drawpile .card:nth-child(2){transform:translate(-3px,3px);filter:brightness(.75)}
#drawpile.can .card:nth-child(3){outline:2px solid var(--text);outline-offset:4px}
#discard .card{transition:outline-color 180ms ease-out}
#discard .card.under{filter:brightness(.7)}
#discard .card.topc{outline:2px solid var(--cc-now,transparent);outline-offset:6px}
#discard.drop .card.topc{outline-color:var(--text)}
#discard .card.land{animation:land 180ms ease-out}
@keyframes land{from{transform:translate(var(--dx),calc(var(--dy) - 10px)) rotate(calc(var(--rot) + 6deg)) scale(1.1)}}
.hud{display:flex;flex-direction:column;gap:8px;min-width:136px}
.hud .row{display:flex;align-items:center;gap:8px}
.chip{width:12px;height:12px;border-radius:2px;background:var(--cc-now,var(--muted))}
.stack{font:900 48px/44px var(--f-ui);font-variation-settings:"wdth" 70}

/* me */
.me{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.me .who{display:flex;align-items:center;gap:8px;font-weight:600}
.me .cnt{font:900 20px/20px var(--f-ui);font-variation-settings:"wdth" 75}
.me .bar{width:96px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
#hand{display:flex;justify-content:center;padding:24px 16px 8px;overflow-x:auto}
#hand .card{flex:none;width:var(--hcw,var(--cw));height:calc(var(--hcw,var(--cw)) * 1.47);cursor:grab;transition:transform 150ms ease-out,opacity 150ms ease-out;touch-action:none;transform-origin:50% 100%;transform:translateY(var(--dy,0px)) rotate(var(--rot,0deg))}
#hand .card.dim{opacity:.45}
#hand .brk{flex-basis:100%;height:0}
#hand .card.ok{transform:translateY(calc(var(--dy,0px) - 6px)) rotate(var(--rot,0deg))}
#hand .card.ok:hover{transform:translateY(calc(var(--dy,0px) - 16px)) rotate(0deg)}
#hand .card.jump{outline:2px solid var(--text);outline-offset:2px;transform:translateY(calc(var(--dy,0px) - 6px)) rotate(var(--rot,0deg))}
#hand .card.new{animation:in 160ms ease-out backwards}
#hand .card.flipin{animation:fade 180ms ease-out backwards}
#hand .card.lifted{opacity:.25}
#hand .card.nope{animation:nope 160ms ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes nope{50%{transform:translateX(-4px)}}

/* cards */
.card{width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.12);background:var(--cc);border:calc(var(--cw)*.06) solid var(--paper);position:relative;overflow:hidden;color:var(--on,#fff)}
.card.s-D{border-color:#0b0b0c}
.card.c-r{--cc:var(--r);--gl:var(--ri)}.card.c-y{--cc:var(--y);--gl:var(--yi);--on:var(--ink)}.card.c-g{--cc:var(--g);--gl:var(--gi)}.card.c-b{--cc:var(--b);--gl:var(--bi)}
.card.c-p{--cc:var(--p);--gl:var(--p)}.card.c-t{--cc:var(--t);--gl:var(--t);--on:var(--ink)}.card.c-o{--cc:var(--o);--gl:var(--o);--on:var(--ink)}.card.c-v{--cc:var(--v);--gl:var(--v)}
.card.c-w{--cc:#161614}.card.s-D.c-w{--cc:#0b0b0c}
.card .oval{position:absolute;left:50%;top:50%;width:84%;height:62%;background:var(--paper);border-radius:50%;transform:translate(-50%,-50%) rotate(28deg);display:flex;align-items:center;justify-content:center}
.card.s-D .oval{background:#0b0b0c}
.card.c-w .oval{background:conic-gradient(var(--r) 0 90deg,var(--b) 0 180deg,var(--y) 0 270deg,var(--g) 0)}
.card.s-D.c-w .oval{background:conic-gradient(var(--p) 0 90deg,var(--t) 0 180deg,var(--o) 0 270deg,var(--v) 0)}
.card .mid{transform:rotate(-28deg);font:900 calc(var(--cw)*.46)/1 var(--f-ui);font-variation-settings:"wdth" 70;color:var(--gl);display:flex;flex-direction:column;align-items:center}
.card.c-w .mid{color:var(--paper);background:#161614;padding:2px 6px;border-radius:4px;font-size:calc(var(--cw)*.32)}
.card .mid.sm{font-size:calc(var(--cw)*.3)}
.card .mid svg{width:calc(var(--cw)*.5);height:calc(var(--cw)*.5);display:block}
.card .mid.sm svg{width:calc(var(--cw)*.38);height:calc(var(--cw)*.38)}
.card .cor svg{width:calc(var(--cw)*.19);height:calc(var(--cw)*.19);display:block}
.card.c-w .mid svg{width:calc(var(--cw)*.34);height:calc(var(--cw)*.34)}
.card .mid em{font:500 calc(var(--cw)*.105)/1.2 var(--f-mono);font-style:normal;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin-top:2px;white-space:nowrap}
.card.s-D .mid em,.card.c-w .mid em{color:var(--paper)}
.card .cor{position:absolute;font:900 calc(var(--cw)*.18)/1 var(--f-ui);font-variation-settings:"wdth" 70}
.card .cor.tl{top:6%;left:8%}.card .cor.br{bottom:6%;right:8%;transform:rotate(180deg)}

/* connection notice */
#netBanner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:120;background:var(--text);color:var(--bg);font:500 13px/20px var(--f-mono);padding:4px 12px;border-radius:4px}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
#fx .card{position:fixed;left:0;top:0;margin:0;will-change:transform}
#toast{height:48px;margin:-16px 0 -8px;pointer-events:none;font:900 40px/48px var(--f-ui);font-variation-settings:"wdth" 70;text-transform:uppercase;opacity:0;transition:opacity 150ms ease-out;white-space:nowrap}
#toast.show{opacity:1}
.float{position:absolute;left:50%;top:8px;transform:translate(-50%,4px);font:500 13px/16px var(--f-mono);background:var(--text);color:var(--bg);padding:2px 8px;border-radius:4px;pointer-events:none;z-index:5;white-space:nowrap;opacity:0;transition:opacity 150ms ease-out,transform 150ms ease-out}
.float.in{opacity:1;transform:translate(-50%,0)}

/* log */
.sidehead{height:48px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#log{flex:1;overflow-y:auto;padding:0 16px;font:400 12px/16px var(--f-mono);color:var(--muted);display:flex;flex-direction:column-reverse}
#log div{padding:8px 0;border-top:1px solid var(--line)}
#log div.n{color:var(--text)}
#log div.win{color:var(--text);font-weight:500}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade 150ms ease-out}
.dialog{background:var(--s2);border-radius:8px;padding:24px;width:100%;max-width:400px}
.dialog h2{font:800 20px/24px var(--f-ui);margin-bottom:8px}
.dialog p{color:var(--muted);margin-bottom:16px}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colors button{height:64px;border-radius:4px;font-weight:700;transition:transform 80ms ease-out,filter 150ms ease-out}
.colors button:hover{filter:brightness(1.08)}
.colors button:active{transform:translateY(1px)}
.list{display:flex;flex-direction:column}
.list button,.list .li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line);font-weight:600;text-align:left;transition:color 150ms ease-out}
.list button:hover:not(:disabled){color:var(--muted)}
.list .li:last-child,.list button:last-child{border-bottom:1px solid var(--line)}
.list .mono{font-weight:500;color:var(--muted)}
.rulestext{max-height:60vh;overflow:auto;color:var(--text)}
.rulestext h3{font:500 12px/16px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.rulestext h3:first-child{margin-top:0}
.rulestext li{margin:0 0 8px 16px;color:var(--muted)}
.rulestext b{color:var(--text);font-weight:600}
.dialog .btn.wide{margin-top:16px}
.pick{display:flex;flex-wrap:wrap;gap:8px;--cw:56px;--ch:82px}
.pick .card{cursor:pointer;transition:opacity 150ms ease-out}
.pick .card.lead{cursor:default;outline:2px solid var(--text);outline-offset:2px}
.pick .card.off{opacity:.3}
.pick .slot{position:relative}
.pick .ord{position:absolute;top:-8px;left:-8px;z-index:2;min-width:20px;height:20px;border-radius:4px;background:var(--text);color:var(--bg);font:500 12px/20px var(--f-mono);text-align:center}

/* ---------- phones: one column, big touch targets, nothing wraps ---------- */
@media (max-width:820px){
  :root{--cw:clamp(50px, min(9.6vh, 16vw), 82px)}
  #game{height:100dvh;bottom:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;border-width:4px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #side{display:none}
  .desk{display:none}
  .mob{display:inline-block}
  #opps{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;gap:4px;padding:8px 8px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #opps::-webkit-scrollbar{display:none}
  .opp{flex:none;width:96px;padding:8px}
  .opp .fan{display:none}
  .opp .meta{margin-top:4px}
  .opp .cnt{font-size:20px;line-height:20px}
  .opp .tags{font-size:10px}
  .opp .nm{font-size:13px}
  .sep{font-size:14px;flex:none}
  #table{gap:8px;padding:4px 0}
  #banner{font-size:13px;padding:0 8px}
  #toast{font-size:24px;line-height:32px;height:32px;margin:-8px 0 -4px}
  .center{flex-direction:column;gap:12px}
  .piles{gap:28px;padding:14px 18px}
  #dirRing{width:calc(100% + 36px);height:calc(100% + 28px)}
  .hud{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;min-width:0}
  .hud .label{font-size:11px}
  .stack{font-size:28px;line-height:28px}
  #bottom{padding:0 8px 8px}
  .me{margin-bottom:4px;gap:8px}
  .me .who{gap:6px;font-size:13px}
  .me .bar{display:none}
  .actions{width:100%;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px}
  .btn{height:44px;padding:0 8px;font-size:14px}
  #ticker{display:block;font:400 12px/16px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 2px 0;min-height:20px}
  #hand{padding:20px 14px 20px}
  .dialog{padding:16px}
  .colors button{height:56px}
}
@media (max-width:820px) and (min-height:740px){
  #table{gap:16px}
  .center{gap:20px}
}
@media (max-width:820px) and (max-height:640px){
  .opp{width:84px;padding:6px}
  #toast{display:none}
}

/* ===================== EDGY LAYER: shader table, CRT, pixel type, juice ===================== */
:root{ --f-px:'Pixelify Sans', ui-monospace, monospace; --hot:#ff2d55; --gold:#ffd23f; --frame:#ffd23f; }
body.dark{ --frame:#ff2d55; }
html{background:#07070a}
body{background:transparent}
body::before{display:none}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-2;image-rendering:pixelated;display:block}
#bg.nogl,body.lite #bg{background:radial-gradient(ellipse at 50% 40%,#0c3a34,#050708 72%)}
body.dark #bg.nogl,body.dark.lite #bg{background:radial-gradient(ellipse at 50% 40%,#4a0619,#07020a 72%)}
body.lite #bg{visibility:visible}
#crt{position:fixed;inset:0;pointer-events:none;z-index:300;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0,rgba(0,0,0,.2) 1px,transparent 1px,transparent 3px),radial-gradient(ellipse at center,transparent 56%,rgba(0,0,0,.62) 100%)}
#grain{position:fixed;inset:-120px;pointer-events:none;z-index:301;opacity:.075;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-30px,20px)}40%{transform:translate(20px,-40px)}60%{transform:translate(-50px,-10px)}80%{transform:translate(40px,30px)}}
body.lite #grain{display:none}
body.lite #crt{background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}
#fxc{position:fixed;inset:0;pointer-events:none;z-index:250}
/* type */
.title{font-family:var(--f-px);font-weight:700;letter-spacing:.02em;text-shadow:4px 4px 0 #000,0 0 26px rgba(255,45,85,.35)}
.title span{color:var(--hot)}
.lede{color:#c9c7c0}
#banner{font-family:var(--f-px);font-size:16px;letter-spacing:.03em;color:#d7d5ce;text-shadow:2px 2px 0 #000}
#banner.you{color:var(--gold);animation:flicker 2.6s infinite}
@keyframes flicker{0%,18%,22%,61%,65%,100%{opacity:1;text-shadow:2px 2px 0 #000,0 0 14px rgba(255,210,63,.75)}20%,63%{opacity:.45;text-shadow:2px 2px 0 #000}}
.opp .cnt,.me .cnt,.code{font-family:var(--f-px)}
/* surfaces: chunky panels with a hard drop */
.page{background:rgba(8,8,12,.78);border:2px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.6);margin-top:24px;margin-bottom:24px}
.opp,.piles,.dialog{background:rgba(8,8,12,.74);border:2px solid rgba(255,255,255,.13);border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.6)}
.opp.turn{border-color:var(--gold);box-shadow:0 6px 0 rgba(0,0,0,.6),0 0 0 3px rgba(255,210,63,.3),0 0 22px rgba(255,210,63,.35)}
#side{background:rgba(6,6,9,.72)}
.modal{background:rgba(0,0,0,.55)}
/* buttons: chunky, they sink when pressed */
.btn{border-radius:10px;font-family:var(--f-px);font-weight:600;letter-spacing:.02em;background:#262630;border:2px solid rgba(255,255,255,.1);box-shadow:0 4px 0 rgba(0,0,0,.7);transition:transform 70ms ease-out,box-shadow 70ms ease-out,background-color 120ms}
.btn:hover:not(:disabled){background:#32323e}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.7)}
.btn.primary{background:var(--hot);color:#fff;border-color:#ff7891}
.btn.primary:hover:not(:disabled){background:#ff4b6e}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none}
.btn.uno.ready{background:var(--gold);color:#141412;border-color:#ffe58a;animation:throb .7s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.07)}}
.seg button.on{background:var(--hot);color:#fff}
/* stack counter heats up */
.stack{font-family:var(--f-px);color:var(--hot);text-shadow:3px 3px 0 #000,0 0 20px rgba(255,45,85,.85);animation:heat .32s infinite}
@keyframes heat{25%{translate:calc(var(--heat,0) * -3px) calc(var(--heat,0) * 2px) ;rotate:calc(var(--heat,0) * -2deg)}75%{translate:calc(var(--heat,0) * 3px) calc(var(--heat,0) * -2px);rotate:calc(var(--heat,0) * 2deg)}}
.chaosline{font:600 13px/18px var(--f-px);color:var(--gold);text-shadow:2px 2px 0 #000}
.chaosline.warn{color:var(--hot);animation:flicker 1.2s infinite}
/* toasts pop */
#toast{font-family:var(--f-px);font-weight:700;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,0 0 22px rgba(255,45,85,.85);rotate:-3deg}
#toast.show{animation:pop2 .38s cubic-bezier(.2,1.9,.4,1)}
@keyframes pop2{from{transform:scale(.25);rotate:-14deg}}
.float{font-family:var(--f-px);background:var(--gold);color:#141412;box-shadow:0 3px 0 #000}
/* cards: hard shadow, sway, tilt, sheen */
.card{box-shadow:0 5px 0 rgba(0,0,0,.5)}
#hand{perspective:700px}
#hand .card{transition:transform 150ms ease-out,opacity 150ms ease-out,rotate 120ms ease-out}
#hand .card::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.4),transparent 46%);opacity:0;transition:opacity 150ms}
#hand .card:hover::after{opacity:1}
body:not(.lite) #hand .card:not(:hover):not(.new):not(.flipin):not(.nope):not(.lifted){animation:sway 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * -.41s)}
@keyframes sway{50%{translate:0 -4px}}
#hand .card.ok:hover{transform:translateY(calc(var(--dy,0px) - 22px)) rotate(0deg) scale(1.06)}
#discard .card.land{animation:land2 260ms cubic-bezier(.2,1.8,.4,1)}
@keyframes land2{from{transform:translate(var(--dx),calc(var(--dy) - 24px)) rotate(calc(var(--rot) + 12deg)) scale(1.25)}}
.piles{background:rgba(0,0,0,.5);border-style:dashed}
/* big moments */
#game.shake2{animation:shake2 .4s}
@keyframes shake2{10%,50%,90%{translate:calc(var(--shk,8px) * -1) calc(var(--shk,8px) * .4)}30%,70%{translate:var(--shk,8px) calc(var(--shk,8px) * -.4)}}
#game.glitch{animation:glitch .36s steps(2)}
@keyframes glitch{0%{filter:drop-shadow(5px 0 rgba(255,0,70,.9)) drop-shadow(-5px 0 rgba(0,255,255,.9));transform:skewX(3deg)}50%{filter:drop-shadow(-6px 0 rgba(255,0,70,.9)) drop-shadow(6px 0 rgba(0,255,255,.9));transform:skewX(-2deg) translateX(5px)}100%{filter:none;transform:none}}
/* chaos slot machine */
#slot{position:fixed;inset:0;z-index:180;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s}
#slot.show{opacity:1}
.slotbox{background:#0b0b10;border:3px solid var(--hot);border-radius:16px;box-shadow:0 8px 0 #000,0 0 44px rgba(255,45,85,.55);padding:16px 20px;text-align:center;transform:scale(.8) rotate(-2deg);transition:transform .28s cubic-bezier(.2,1.8,.4,1)}
#slot.show .slotbox{transform:scale(1) rotate(-1deg)}
.slottitle{font:700 14px var(--f-px);color:var(--gold);letter-spacing:.3em;margin-bottom:10px}
.reels{display:flex;gap:8px;justify-content:center}
.reels b{width:88px;height:74px;display:grid;place-items:center;background:#fbfaf6;color:#141412;border-radius:8px;font:700 26px var(--f-px);box-shadow:inset 0 7px 0 rgba(0,0,0,.18),inset 0 -7px 0 rgba(0,0,0,.18)}
.reels b.spin{filter:blur(1.4px);transform:translateY(2px)}
.reels b.stop{background:var(--gold);animation:reelstop .26s cubic-bezier(.2,1.8,.4,1)}
@keyframes reelstop{from{transform:translateY(-16px)}}
.slotres{margin-top:12px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#slot.done .slotres{opacity:1;transform:none}
.slotname{display:block;font:700 30px var(--f-px);color:#fff;text-shadow:3px 3px 0 #000}
.slotsub{display:block;font:500 14px var(--f-ui);color:#d0cfd6;margin-top:4px}
.seatrow .bot{color:var(--gold)}
@media (max-width:820px){
  .page{margin:8px;border-radius:12px}
  .reels b{width:64px;height:56px;font-size:19px}
  .slotname{font-size:22px}
  #banner{font-size:14px}
}
@media (prefers-reduced-motion: reduce){ #grain{display:none} }
</style>

<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div id="start" class="screen">
  <div class="page">
    <h1 class="title">UNO Flip<br><span>No Mercy</span></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="field"><span class="label" data-i18n="language"></span><div class="seg" id="segLang"></div></div>
    <div class="field"><span class="label" data-i18n="name"></span><input id="pname" type="text" maxlength="14" value="Player"></div>
    <div class="section"><button class="btn primary wide" id="btnCreate" data-i18n="createRoom"></button></div>
    <div class="section">
      <span class="label" data-i18n="haveCode"></span>
      <div class="actions-row">
        <input id="joinCode" class="code-in" type="text" maxlength="4" placeholder="CODE" data-i18n-ph="codePh" autocomplete="off">
        <button class="btn" id="btnJoin" data-i18n="joinRoom"></button>
      </div>
    </div>
    <div class="msg" id="startMsg"></div>
    <button class="textlink" data-rules data-i18n="howTo"></button>

</div>

<div id="lobby" class="screen hidden">

    <span class="label" data-i18n="roomCode"></span>

    <p class="lede" id="lbHint" style="margin:8px 0 24px"></p>
    <div class="actions-row" id="shareBox" style="margin-bottom:24px"><input type="text" id="shareLink" readonly style="flex:1"><button class="btn" id="btnCopyLink" data-i18n="copyLink"></button></div>
    <div class="field"><span class="label" data-i18n="yourName"></span><input id="lbName" type="text" maxlength="14"></div>
    <div class="section"><span class="label" data-i18n="players"></span><div id="lbSeats" style="margin-top:8px"></div></div>
    <div id="lbHost">
      <div class="section actions-row"><button class="btn" id="btnAddBot" data-i18n="addBot"></button><button class="btn" id="btnRmBot" data-i18n="rmBot"></button></div>
      <div class="section"><button class="btn primary wide" id="btnRoomStart" data-i18n="startGame"></button></div>
      <div class="section"><span class="label" data-i18n="rules"></span><div id="lbRules"></div></div>
      <div class="section hidden"><span class="label" data-i18n="extraCards"></span><div id="lbCards"></div></div>

  <div id="opps"></div>

    <div id="banner"></div>
    <div id="toast"></div>
    <div class="center" id="center">
      <div class="piles">
        <div class="pile" id="drawpile" title="Draw pile: you can see the back of the next card"></div>

    </div>
  </div>

    <div class="me">
      <div class="who"><span class="ini" id="meIni"></span><span id="meName"></span><span class="cnt" id="meCnt"></span><span class="tags label" id="meTags"></span><div class="bar" id="meBarWrap"><div id="meDanger"></div></div></div>
      <div class="actions">
        <button class="btn primary" id="btnDraw" data-i18n="draw"></button>
        <button class="btn" id="btnPass" data-i18n="pass"></button>
        <button class="btn uno" id="btnUno" data-i18n="uno"></button>
        <button class="btn quiet desk" id="btnSort">Sort</button>
        <button class="btn quiet desk" data-rules data-i18n="rules"></button>

        <button class="btn mob" id="btnMenu" data-i18n="menu"></button>

</div>

<div id="netBanner" class="hidden"></div>
<canvas id="fxc" aria-hidden="true"></canvas>
<div id="slot" class="hidden" aria-live="polite"></div>
<div id="crt" aria-hidden="true"></div><div id="grain" aria-hidden="true"></div>
<div id="fx"></div>
<div id="modal" class="modal hidden"><div class="dialog" id="modalBody"></div></div>

<script>
// ===== ENGINE: UNO Flip × No Mercy × Classic (no DOM) =====
const SIDE_COLORS = { L: ['r', 'y', 'g', 'b'], D: ['p', 't', 'o', 'v'] };
const COLOR_NAME = { r: 'Red', y: 'Yellow', g: 'Green', b: 'Blue', p: 'Pink', t: 'Teal', o: 'Orange', v: 'Purple', w: 'Wild' };
const VALUE_NAME = {
  skip: 'Skip', rev: 'Reverse', d1: 'Draw 1', d2: 'Draw 2', d4: 'Draw 4', d5: 'Draw 5', flip: 'Flip',
  discall: 'Discard All', skipall: 'Skip Everyone', wild: 'Wild', wd2: 'Wild Draw 2', wd4: 'Wild Draw 4',
  wrd4: 'Wild Reverse Draw 4', wd6: 'Wild Draw 6', wd10: 'Wild Draw 10', wrd8: 'Wild Reverse Draw 8',
  wdc: 'Wild Draw Color', roul: 'Wild Color Roulette',
  mirror: 'Mirror', shield: 'Shield', dflip: 'Double Flip', duel: 'Wild Duel', wd15: 'Wild Draw 15', bhole: 'Black Hole'
};
const EXTRA_CARDS = []; // official cards only: classic, Flip and No Mercy
const DRAW_VAL = { d1: 1, d2: 2, wd2: 2, d4: 4, wd4: 4, wrd4: 4, d5: 5, wd6: 6, wrd8: 8, wd10: 10, wd15: 15 };
// Weights for each side. Light = classic UNO + Flip light side + No Mercy. Dark = Flip dark side, nastier.
const SIDE_WEIGHTS = {
  L: { colored: { '0': 1, '1': 2, '2': 2, '3': 2, '4': 2, '5': 2, '6': 2, '7': 2, '8': 2, '9': 2, skip: 2, rev: 2, d1: 2, d2: 2, flip: 2, d4: 1, discall: 2, skipall: 1 },
       wild: { wild: 4, wd2: 2, wd4: 3, wrd4: 3, wd6: 2, wd10: 1, roul: 2 } },
  D: { colored: { '1': 2, '2': 2, '3': 2, '4': 2, '5': 2, '6': 2, '7': 2, '8': 2, '9': 2, skipall: 2, rev: 2, d5: 2, flip: 2, discall: 2 },
       wild: { wild: 4, wdc: 4, wd6: 2, wd10: 2, wrd4: 2, roul: 2 } }
};
const FACES = {}, FACE_W = {};
for (const s of ['L', 'D']) {
  FACES[s] = []; FACE_W[s] = [];
  for (const c of SIDE_COLORS[s]) for (const [v, w] of Object.entries(SIDE_WEIGHTS[s].colored)) { FACES[s].push({ c, v }); FACE_W[s].push(w); }
  for (const [v, w] of Object.entries(SIDE_WEIGHTS[s].wild)) { FACES[s].push({ c: 'w', v }); FACE_W[s].push(w); }
}
// Safe printable chars ('#'..'~' minus backslash, then Latin-1 ¡..ÿ) index faces on the wire: 1 char per side.
const ALPHA = (Array.from({ length: 92 }, (_, i) => String.fromCharCode(35 + i)).filter(ch => ch !== '\\').join('') + Array.from({ length: 95 }, (_, i) => String.fromCharCode(161 + i)).join(''));
const faceIdx = (s, f) => FACES[s].findIndex(x => x.c === f.c && x.v === f.v);
let CARD_ID = 1;
function randFace(s) {
  const w = FACE_W[s]; let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return Object.assign({}, FACES[s][i]);
  return Object.assign({}, FACES[s][0]);
}
function randCard() { return { id: CARD_ID++, L: randFace('L'), D: randFace('D') }; }
const cardCode = card => ALPHA[faceIdx('L', card.L)] + ALPHA[faceIdx('D', card.D)];
const codeCard = code => ({ id: CARD_ID++, L: Object.assign({}, FACES.L[ALPHA.indexOf(code[0])]), D: Object.assign({}, FACES.D[ALPHA.indexOf(code[1])]) });
const other = s => s === 'L' ? 'D' : 'L';
function faceName(f) { return f.c === 'w' ? VALUE_NAME[f.v] : COLOR_NAME[f.c] + ' ' + (VALUE_NAME[f.v] || f.v); }

class Game {
  constructor(names, humans, rules) {
    rules = Object.assign({}, rules);
    if ('sevenZero' in rules && !('seven' in rules)) { rules.seven = rules.zero = rules.sevenZero; }
    delete rules.sevenZero;
    this.rules = Object.assign({ stacking: true, drawUntil: true, seven: true, zero: true, multi: true, jumpIn: true, mercy: 25, handSize: 7, uno: true, flip: true, chaos: true }, rules);
    this.rules.cards = Object.assign(Object.fromEntries(EXTRA_CARDS.map(k => [k, true])), rules.cards);
    // card values that never get dealt at this table
    this.rules.off = EXTRA_CARDS.filter(k => !this.rules.cards[k]).concat(this.rules.flip ? [] : ['flip', 'dflip']);
    const hum = Array.isArray(humans) ? humans : [humans];
    this.gid = Math.random().toString(36).slice(2, 8);
    this.side = 'L';
    this.next = this.newCard();
    this.players = names.map((n, i) => ({ name: n, hand: [], human: hum.includes(i), out: false, elim: false, unoCalled: false, vulnerable: false, shield: false, oweN: 0, owed: [], av: '', peer: '' }));
    for (const p of this.players) for (let i = 0; i < this.rules.handSize; i++) p.hand.push(this.newCard());
    let top;
    do { top = this.newCard(); } while (top.L.c === 'w' || isNaN(+top.L.v));
    this.top = top; this.color = top.L.c; this.dir = 1;
    this.pile = [cardCode(top)]; this.pileN = 1; // recent discards, so the pile can show a few cards underneath
    this.turn = Math.floor(Math.random() * names.length);
    this.pending = 0; this.stackMin = 0; this.stackFrom = -1; this.roulette = null; this.flipBack = null;
    this.debt = null; // cards someone must draw by hand before play moves on: { pi, n | until, got, kind }
    // Chaos: every few plays the table rolls a random event
    this.chaosIn = 9; this.inflate = 0; this.lock = 0; this.lastChaos = null;
    this.drewBy = -1; this.winner = null; this.log = []; this.seq = 0;
    this.events = []; this.evSeq = 0;
    this.addLog(`First card: ${faceName(top.L)}. ${this.players[this.turn].name} starts.`, '', 'first', { f: top.L, n: this.players[this.turn].name });
    this.ev('start');
  }
  newCard() {
    const c = randCard(), off = this.rules.off || [];
    for (const s of ['L', 'D']) { let g = 0; while (off.includes(c[s].v) && g++ < 60) c[s] = randFace(s); }
    return c;
  }
  f(card) { return card[this.side]; }
  back(card) { return card[other(this.side)]; }
  colors() { return SIDE_COLORS[this.side]; }
  addLog(msg, cls = '', k = null, a = null) { this.log.push({ msg, cls, k, a }); if (this.log.length > 200) this.log.shift(); }
  ev(type, data = {}) { this.events.push(Object.assign({ type, n: ++this.evSeq }, data)); if (this.events.length > 24) this.events.shift(); }
  active() { return this.players.filter(p => !p.out); }
  nextIdx(from, steps = 1) {
    let i = from; const n = this.players.length;
    for (let s = 0; s < steps; s++) { let g = 0; do { i = (i + this.dir + n) % n; } while (this.players[i].out && ++g < n); }
    return i;
  }
  owes(pi) { const p = this.players[pi]; return !!p && !p.out && ((p.oweN || 0) > 0 || (p.owed && p.owed.length > 0)); }
  canPlay(card) {
    if (this.roulette !== null || this.debt || card.hidden || this.owes(this.turn)) return false;
    const f = this.f(card), t = this.f(this.top);
    if (this.pending > 0) return f.v === 'mirror' || (this.rules.stacking && (DRAW_VAL[f.v] || 0) >= this.stackMin);
    if (this.lock > 0) return f.c === 'w' || f.c === this.color;
    return f.c === 'w' || f.c === this.color || f.v === t.v;
  }
  canJumpIn(pi, card) {
    if (!this.rules.jumpIn || this.winner !== null || this.roulette !== null || this.debt || pi === this.turn || this.players[pi].out || card.hidden || this.owes(pi)) return false;
    const f = this.f(card), t = this.f(this.top);
    return f.c === t.c && f.v === t.v;
  }
  playable(pi) { return this.players[pi].hand.filter(c => this.canPlay(c)); }
  validColor(c, pi) { return this.colors().includes(c) ? c : Bot.bestColor(this, this.players[pi].hand, this.side); }
  give(pi, k, until) {
    const p = this.players[pi]; const got = [];
    while (true) {
      if (until) { if (got.length && until(got[got.length - 1])) break; }
      else if (got.length >= k) break;
      const c = this.next; this.next = this.newCard();
      p.hand.push(c); got.push(c);
      if (this.rules.mercy && p.hand.length >= this.rules.mercy) break;
      if (got.length > 300) break;
    }
    if (p.hand.length !== 1) p.vulnerable = false;
    if (got.length) this.ev('draw', { pi, k: got.length });
    return got;
  }
  mercyCheck() {
    if (this.rules.mercy) for (const p of this.players) {
      if (!p.out && p.hand.length >= this.rules.mercy) {
        p.out = true; p.elim = true;
        this.addLog(`${p.name} hit ${p.hand.length} cards and is knocked out by the Mercy Rule.`, 'bad', 'ko', { n: p.name, k: p.hand.length });
        this.ev('ko', { pi: this.players.indexOf(p) });
      }
    }
    const act = this.active();
    if (act.length === 1 && this.winner === null) {
      this.winner = this.players.indexOf(act[0]);
      this.addLog(`${act[0].name} is the last one standing.`, 'win', 'lastLeft', { n: act[0].name });
      this.ev('win', { pi: this.winner });
    }
    if (this.winner === null && this.players[this.turn].out) this.turn = this.nextIdx(this.turn, 1);
    if (this.roulette !== null && this.players[this.roulette].out) { this.roulette = null; }
    if (this.debt && this.players[this.debt.pi].out) this.debt = null;
  }
  play(pi, cardId, opts = {}) {

      case 'wdc': {

        this.debt = { pi: vi, until: col, got: 0, kind: 'wdc' };
        this.addLog(`${this.players[vi].name} must draw until they hit ${COLOR_NAME[col]}.`, 'bad', 'wdc', { n: this.players[vi].name, c: col });
        this.turn = vi; steps = -1; break;

      case 'dflip':

        this.side = other(this.side);
        this.flipBack = face.v === 'dflip' ? { pi: this.nextIdx(pi, 1), seq: this.seq } : null;
        const nf = this.f(this.top);
        this.color = nf.c === 'w' ? this.validColor(opts.flipColor, pi) : nf.c;
        this.addLog(`Flip. Everything turns to the ${this.side === 'D' ? 'dark' : 'light'} side. Top card is now ${faceName(nf)}${nf.c === 'w' ? ' → ' + COLOR_NAME[this.color] : ''}.`, 'flip', 'flip', { dk: this.side === 'D' ? 1 : 0, f: nf, c: nf.c === 'w' ? this.color : null });

  // Double Flip: once the player after the flipper has acted, the table turns back.
  checkFlipBack() {

      const nf = this.f(this.top);
      this.color = nf.c === 'w' ? Bot.bestColor(this, this.players[this.turn].hand, this.side) : nf.c;
      this.addLog(`The double flip wears off. Back to the ${this.side === 'D' ? 'dark' : 'light'} side: ${faceName(nf)}${nf.c === 'w' ? ' → ' + COLOR_NAME[this.color] : ''}.`, 'flip', 'dflipOff', { dk: this.side === 'D' ? 1 : 0, f: nf, c: nf.c === 'w' ? this.color : null });

  applyShield() {

      this.ev('shield', { pi: this.turn, k: this.pending });

  // Every draw is one card by hand. Owed cards (UNO penalty, a lost duel) can be paid any time;

          d.kind === 'stack' ? 'pickedUp' : 'drewUntil', { n: p.name, k: d.got, h: p.hand.length, c: d.until || null });
        if (d.got >= 10) this.ev('took', { pi, k: d.got });

        this.turn = this.nextIdx(pi, 1);

      this.addLog(`${p.name} takes the +${this.pending} stack.`, 'bad', 'takes', { n: p.name, k: this.pending });

  }
  pass(pi) {

  resolveRoulette(color) {

    if (!this.colors().includes(color)) color = Bot.bestColor(this, this.players[vi].hand, this.side);
    this.color = color;

  // ---- Chaos events ----
  rollChaos() {
    this.chaosIn = 8 + Math.floor(Math.random() * 5);
    const act = this.players.map((p, i) => i).filter(i => !this.players[i].out);
    const pool = ['inflation', 'tax', 'revolution', 'storm', 'lock', 'bleed', 'jackpot', 'mirrorworld'];
    if (!this.rules.flip) pool.splice(pool.indexOf('storm'), 1);
    if (this.debt || this.roulette !== null) { const s = pool.indexOf('revolution'); if (s >= 0) pool.splice(s, 1); }

    const data = { e };

      case 'lock': this.lock = 4; break;          // only the color (or a wild) can be played for 4 plays
      case 'tax': {                               // whoever is closest to winning pays 2
        const min = Math.min(...act.map(i => this.players[i].hand.length));
        data.who = act.filter(i => this.players[i].hand.length === min);
        for (const i of data.who) this.players[i].oweN = (this.players[i].oweN || 0) + 2;
        break;
      }
      case 'bleed': for (const i of act) this.players[i].oweN = (this.players[i].oweN || 0) + 1; break; // everyone pays 1
      case 'revolution': {                        // every hand moves one seat along
        const hands = act.map(i => this.players[i].hand);
        act.forEach((i, k) => { this.players[act[(k + 1) % act.length]].hand = hands[k]; });
        for (const i of act) this.players[i].vulnerable = false;
        break;

      case 'storm': {                             // the table flips
        this.side = other(this.side);

        this.color = nf.c === 'w' ? this.colors()[Math.floor(Math.random() * 4)] : nf.c;
        this.ev('flip', { side: this.side });
        break;
      }
      case 'jackpot': {                           // one lucky player throws away 2 random cards
        const cands = act.filter(i => this.players[i].hand.length > 2);
        if (cands.length) {
          const w = cands[Math.floor(Math.random() * cands.length)], h = this.players[w].hand;
          for (let k = 0; k < 2; k++) h.splice(Math.floor(Math.random() * h.length), 1);
          data.who = [w];
        }
        break;

      case 'mirrorworld': this.dir *= -1; this.ev('reverse', { dir: this.dir }); break;

    this.lastChaos = data;
    const names = data.who ? data.who.map(i => this.players[i].name) : [];
    this.addLog(`Chaos: ${e}${names.length ? ' (' + names.join(', ') + ')' : ''}.`, 'flip', 'chaos', { e, w: names });
    this.ev('chaos', data);
  }
  // A player who leaves (or stays disconnected too long) is out of this match; everyone else plays on.
  removePlayer(pi, why = 'left') {
    const p = this.players[pi];
    if (!p || p.out || this.winner !== null) return false;
    p.out = true; p.left = true; p.vulnerable = false; p.shield = false;
    this.addLog(`${p.name} ${why === 'left' ? 'left the match' : 'was away too long and is out of the match'}. Everyone else plays on.`, 'bad', 'left', { n: p.name, aw: why === 'left' ? 0 : 1 });

    if (this.debt && this.debt.pi === pi) this.debt = null;
    p.oweN = 0; p.owed = [];

    if (this.flipBack && this.flipBack.pi === pi) this.flipBack.pi = this.nextIdx(pi, 1);
    if (this.turn === pi) {

      this.winner = this.players.indexOf(act[0]);
      this.addLog(`${act[0].name} is the last player left and wins.`, 'win', 'lastLeft', { n: act[0].name });
      this.ev('win', { pi: this.winner });

    return true;
  }

    <h3>Хаос</h3><ul><li>Каждые 8–12 ходов крутится слот-машина и выпадает событие: Инфляция («Возьми» вдвойне 6 ходов), Налог на лидера (у кого меньше всего карт — берёт 2), Революция (руки сдвигаются на место), Флип-шторм, Блокировка цвета (4 хода только цвет или джокер), Кровопускание (каждый берёт 1), Джекпот (счастливчик сбрасывает 2 случайные карты) или Зазеркалье (направление меняется).</li></ul>

    <li>Пропала связь — есть 60 секунд, чтобы вернуться на своё место. Откройте страницу снова, и вы вернётесь.</li>
    <li>Если игрока нет, его ход пропускается через 15 секунд. Нажали «Выйти» или отсутствуете больше минуты — вы выбываете из партии; побеждает последний оставшийся.</li></ul>`

// ===== ASSETS: an optional pack of card sprites, fonts, sounds and a background, loaded from /assets =====
// Anything missing falls back to the built-in look and synthesized sounds. See template/README.md.
const ASSETS = (() => {
  let man = null, cfg = {};
  const cards = new Set();
  const sounds = {};      // name -> [file]
  const buffers = {};     // file -> AudioBuffer | 'loading' | 'bad'
  let music = null;
  const keyOf = (f, side) => `${side}-${f.c}-${f.v}`;
  const cls = k => 'spr-' + k.replace(/[^a-z0-9-]/gi, '_');
  function cardClass(f, side) { const k = keyOf(f, side); return cards.has(k) ? cls(k) : ''; }
  function css(text) { const s = document.createElement('style'); s.textContent = text; document.head.appendChild(s); }

  async function load() {
    try { const r = await fetch('assets/manifest.json', { cache: 'no-cache' }); if (!r.ok) return; man = await r.json(); } catch (e) { return; }
    cfg = man.config || {};
    const rules = [];
    // cards: assets/cards/<side>-<color>-<value>.png, e.g. L-r-7.png, D-w-bhole.png
    for (const file of man.cards || []) {
      const k = file.replace(/\.[^.]+$/, '');
      if (!/^[LD]-[a-z]-[a-z0-9]+$/i.test(k)) continue;
      cards.add(k); rules.push(`.${cls(k)}{background-image:url("assets/cards/${encodeURIComponent(file)}")}`);
    }
    if (cards.size) rules.push(`.card.spr{background-color:transparent;background-position:center;background-size:100% 100%;background-repeat:no-repeat;border:0;border-radius:${cfg.cardRadius ?? 0}px;box-shadow:none${cfg.pixelated ? ';image-rendering:pixelated' : ''}}`,
      `.card.spr .oval,.card.spr .cor{display:none}`);
    // fonts: assets/font/ui.* replaces all text, assets/font/display.* replaces titles, numbers, buttons and toasts
    const F = man.font || {};
    if (F.ui) rules.push(`@font-face{font-family:'PackUI';src:url("assets/font/${encodeURIComponent(F.ui)}");font-display:swap}`,
      `:root{--f-ui:'PackUI',system-ui,sans-serif;--f-mono:'PackUI',ui-monospace,monospace}body,button,input,select,.label,.mono,#log{font-family:'PackUI',system-ui,sans-serif}`);
    if (F.display || F.ui) rules.push(`@font-face{font-family:'PackDisplay';src:url("assets/font/${encodeURIComponent(F.display || F.ui)}");font-display:swap}`,
      `:root{--f-px:'PackDisplay',system-ui,sans-serif}.title,#toast,.stack,.btn,.opp .cnt,.me .cnt,.code,#banner,.card .mid,.card .cor,.slottitle,.slotname,.reels b,.chaosline,.float{font-family:'PackDisplay',system-ui,sans-serif}`);
    if (cfg.pixelated && (F.ui || F.display)) rules.push(`*{-webkit-font-smoothing:none;font-synthesis:none}`);
    // background: assets/bg.png (or .jpg/.webp/.gif) replaces the animated swirl
    if (man.bg) rules.push(`#bg{display:none!important}html{background:#07070a url("assets/${encodeURIComponent(man.bg)}") center/cover fixed${cfg.pixelated ? ';image-rendering:pixelated' : ''}}`);
    if (cfg.crt === false) rules.push(`#crt,#grain{display:none!important}`);
    if (rules.length) css(rules.join('\n'));

    Object.assign(sounds, man.sounds || {});
    if (sounds.music) startMusicOnGesture();
    if (typeof G !== 'undefined' && G) render();
  }

  function decode(file) {
    if (buffers[file] || !SFX.ctx) return;
    buffers[file] = 'loading';
    fetch('assets/sounds/' + encodeURIComponent(file)).then(r => r.arrayBuffer()).then(b => SFX.ctx.decodeAudioData(b))
      .then(buf => { buffers[file] = buf; }).catch(() => { buffers[file] = 'bad'; });
  }
  // returns true when a pack sound handled it (the synth then stays quiet)
  function playSound(name, k = 1) {
    const files = sounds[name]; if (!files || !files.length || !SFX.ctx) return false;
    files.forEach(decode);
    const ready = files.filter(f => buffers[f] && typeof buffers[f] === 'object');
    if (!ready.length) return false; // still decoding: the synth covers this one
    const buf = buffers[ready[Math.floor(Math.random() * ready.length)]];
    const src = SFX.ctx.createBufferSource(), g = SFX.ctx.createGain();
    src.buffer = buf;

    if (['play', 'stack', 'draw'].includes(name) && cfg.pitchCombos !== false) src.playbackRate.value = Math.pow(2, Math.min(k - 1, 12) / 24);
    g.gain.value = (cfg.volume ?? 1) * ((cfg.volumes || {})[name] ?? 1);

    return true;
  }
  function startMusicOnGesture() {
    const go = () => {
      if (music || !S.sound) return;
      music = new Audio('assets/sounds/' + encodeURIComponent(sounds.music[0]));
      music.loop = true; music.volume = Math.min(1, cfg.musicVolume ?? 0.35); music.play().catch(() => { music = null; });

    setInterval(() => { if (music) { if (!S.sound && !music.paused) music.pause(); else if (S.sound && music.paused) music.play().catch(() => {}); } }, 500);
  }
  return { load, cardClass, playSound, get manifest() { return man; } };
})();

// ===== JUICE: shader background, CRT, particles, shake, glitch, card tilt, chaos slot machine =====
const JUICE = (() => {
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { side: 0, sideT: 0, heat: 0, heatT: 0, gl: null };
  const full = () => (S.fx || (reduce ? 'lite' : 'full')) === 'full';

  // ---- swirling background (WebGL, rendered at low resolution for a chunky look) ----
  function startBg() {
    const cv = document.getElementById('bg'); if (!cv) return;
    let gl; try { gl = cv.getContext('webgl', { antialias: false, alpha: false }); } catch (e) {}
    if (!gl) { cv.classList.add('nogl'); return; }
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = `precision mediump float;uniform float t;uniform vec2 r;uniform float side;uniform float heat;
      void main(){
        vec2 uv=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
        float len=length(uv);
        float ang=atan(uv.y,uv.x)+t*.12*(1.+heat*2.5)-len*(2.2+heat*2.);
        uv=vec2(cos(ang),sin(ang))*len;
        vec2 p=uv*3.2;
        for(int i=0;i<5;i++){p+=vec2(sin(p.y*1.27+t*.35),cos(p.x*1.13-t*.29))*.55;}
        float v=sin(p.x+p.y)*.5+.5;
        float w=sin(length(p)*1.6-t*.55)*.5+.5;
        vec3 a=mix(vec3(.04,.32,.28),vec3(.52,.04,.16),side);
        vec3 b=mix(vec3(.01,.09,.11),vec3(.12,.0,.07),side);
        vec3 c=mix(vec3(.92,.66,.14),vec3(1.,.18,.42),side);
        vec3 col=mix(b,a,v);
        col=mix(col,c,smoothstep(.78,1.,w)*.32);
        col=mix(col,vec3(1.,.08,.06),heat*.45*w);
        col=floor(col*10.)/10.;
        float vig=smoothstep(1.35,.25,len);
        gl_FragColor=vec4(col*vig*.9,1.);
      }`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { cv.classList.add('nogl'); return; }
    gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = { t: gl.getUniformLocation(pr, 't'), r: gl.getUniformLocation(pr, 'r'), side: gl.getUniformLocation(pr, 'side'), heat: gl.getUniformLocation(pr, 'heat') };
    const size = () => { const k = innerWidth > 900 ? 4 : 3; cv.width = Math.ceil(innerWidth / k); cv.height = Math.ceil(innerHeight / k); gl.viewport(0, 0, cv.width, cv.height); };
    size(); addEventListener('resize', size);
    state.gl = gl;
    const t0 = performance.now(); let last = 0;
    (function frame(now) {
      requestAnimationFrame(frame);

      state.heat += (state.heatT - state.heat) * 0.05;

  }

  // ---- particles (pixel squares) ----
  let pc, px, parts = [];
  function burst(x, y, n, colors, power = 1) {
    if (!full()) return;
    if (!pc) { pc = document.getElementById('fxc'); px = pc.getContext('2d'); const fit = () => { pc.width = innerWidth; pc.height = innerHeight; }; fit(); addEventListener('resize', fit); loop(); }
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 6) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3 * power, life: 40 + Math.random() * 30, c: colors[i % colors.length], sz: 3 + Math.random() * 5 });
    }
  }

    requestAnimationFrame(loop);

      p.vy += 0.32; p.vx *= 0.98; p.x += p.vx; p.y += p.vy;

    el.style.rotate = `${(-dy).toFixed(3)} ${dx.toFixed(3)} 0 ${Math.min(22, Math.hypot(dx, dy) * 34).toFixed(1)}deg`;
    el.style.setProperty('--gx', ((dx + 0.5) * 100).toFixed(0) + '%');
    el.style.setProperty('--gy', ((dy + 0.5) * 100).toFixed(0) + '%');
  }

  // ---- chaos slot machine ----
  const GLYPH = { inflation: '×2', tax: 'TAX', revolution: 'REV', storm: 'FLIP', lock: 'LOCK', bleed: '−1', jackpot: '777', mirrorworld: 'MIR' };
  let slotBusy = null;
  function slot(ev) {
    const el = document.getElementById('slot'); if (!el) return;
    const keys = Object.keys(GLYPH), [title, sub] = (STR[LANG].ev[ev] || STR.en.ev[ev] || [ev, '']);
    el.innerHTML = `<div class="slotbox"><div class="slottitle">${esc(t('chaosTitle'))}</div><div class="reels"><b></b><b></b><b></b></div><div class="slotres"><span class="slotname">${esc(title)}</span><span class="slotsub">${esc(sub)}</span></div></div>`;
    el.classList.remove('hidden', 'done'); void el.offsetWidth; el.classList.add('show');

        else if (r.classList.contains('spin')) { r.classList.remove('spin'); r.textContent = GLYPH[ev] || '?'; r.classList.add('stop'); SFX.play('reel', k); }

})();

// ================= SOUND (synthesized, no files) =================
const SFX = {
  ctx: null, out: null, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const ctx = this.ctx = arguments[0] || new (window.AudioContext || window.webkitAudioContext)();
      // master chain: gentle compressor + a short room so sounds sit together
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
      const master = ctx.createGain(); master.gain.value = 0.9;
      const dry = ctx.createGain(), wet = ctx.createGain(); wet.gain.value = 0.18;
      const dl = ctx.createDelay(); dl.delayTime.value = 0.045; const fb = ctx.createGain(); fb.gain.value = 0.28;
      const damp = ctx.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 3200;

  },
  route(node, wet = 0.3) { node.connect(this.out.dry); if (wet) { const g = this.ctx.createGain(); g.gain.value = wet; node.connect(g); g.connect(this.out.send); } },

    flt.frequency.setValueAtTime(f1, t); flt.frequency.exponentialRampToValueAtTime(f2, t + dur);

    src.connect(flt); flt.connect(g); this.route(g, 0.15);

  },
  // a tuned strike: sine + a couple of partials with fast decay (marimba / chime feel)

    o.frequency.setValueAtTime(freq * 1.8, t); o.frequency.exponentialRampToValueAtTime(freq, t + dur * 0.5);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); this.route(g, 0); o.start(t); o.stop(t + dur + 0.05);
  },
  play(name, k = 1) {
    if (!S.sound || !this.ctx || (this.ctx.state !== 'running' && !this.offline)) return;
    if (!this.offline && ASSETS.playSound(name, k)) return; // a sound file from the asset pack wins
    const t = this.ctx.currentTime + 0.005;

          this.rustle(t, 0.09, 4200, 1800, 0.9, 0.5); this.rustle(t + 0.05, 0.05, 2400, 1200, 1.5, 0.35); this.thump(t + 0.05, 95, 0.09, 0.4);

        break;
      }
      case 'took': SFX.play('took'); if (e.k >= 10) JUICE.shake(4); if (e.k >= 10) bump(TOAST_PRI.took, `+${e.k}`); break;
      case 'stack': SFX.play('stack', e.k); JUICE.shake(Math.min(4, 1 + e.k / 8)); bump(TOAST_PRI.stack, t('tStack', e.k)); break;
      case 'skip': SFX.play('skip'); floatText(e.pi, t('tSkipped')); break;
      case 'skipall': SFX.play('skip'); bump(TOAST_PRI.skipall, t('tSkipAll')); break;
      case 'reverse': SFX.play('skip'); bump(TOAST_PRI.reverse, t('tReverse')); break;
      case 'swap': SFX.play('swap'); bump(TOAST_PRI.swap, t('tSwap')); break;
      case 'rotate': SFX.play('swap'); bump(TOAST_PRI.rotate, t('tRotate')); break;
      case 'roulette': SFX.play('stack', 3); bump(TOAST_PRI.roulette, t('tRoulette')); break;
      case 'uno': SFX.play('uno'); floatText(e.pi, t('tUno')); break;
      case 'multi': bump(TOAST_PRI.multi, t('tMulti', e.k)); break;
      case 'caught': SFX.play('bad'); floatText(e.pi, t('tCaught')); break;
      case 'ko': SFX.play('ko'); JUICE.glitch(); bump(TOAST_PRI.ko, t('tOut', nm(e.pi))); break;
      case 'win': SFX.play('win'); JUICE.burst(innerWidth / 2, innerHeight * 0.4, 160, ['#ff2d55', '#ffd23f', '#22d3ee', '#a3e635', '#fff'], 2); bump(TOAST_PRI.win, e.pi === ME ? t('youWin') : t('wins', nm(e.pi))); break;
      case 'mirror': SFX.play('swap'); bump(TOAST_PRI.mirror, t('tMirror', nm(e.b))); break;
      case 'shieldup': SFX.play('click'); floatText(e.pi, t('tShieldUp')); break;
      case 'shield': SFX.play('swap'); bump(TOAST_PRI.shield, t('tShield', e.k)); break;
      case 'duel': SFX.play('stack', 2); bump(TOAST_PRI.duel, `${e.na} vs ${e.nb}`); break;
      case 'bhole': SFX.play('shuffle'); bump(TOAST_PRI.bhole, t('tBhole')); break;
      case 'chaos': JUICE.slot(e.e); break;
      case 'flip':
        SFX.play('flip'); JUICE.glitch(); JUICE.shake(2); bump(TOAST_PRI.flip, e.side === 'D' ? t('tDark') : t('tLight'));
        document.querySelectorAll('#hand .card').forEach(el => { el.classList.remove('new'); el.classList.add('flipin'); });
        break;
    }
  }
  if (best) toast(best.text);
}
window.addEventListener('resize', () => render());

// ================= DIALOGS =================
function openModal(html) { $('modalBody').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
const ON_COLOR = { y: 'var(--ink)', t: 'var(--ink)', o: 'var(--ink)' };
function pickColor(title, sub, side) {
  return new Promise(res => {
    openModal(`<h2>${esc(title)}</h2><p>${esc(sub)}</p><div class="colors">${SIDE_COLORS[side].map(c => `<button data-c="${c}" style="background:${CVAR[c]};color:${ON_COLOR[c] || '#fff'}">${colorName(c)}</button>`).join('')}</div>`);
    $('modalBody').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { SFX.play('click'); closeModal(); res(b.dataset.c); });
  });
}
function pickTarget(title, sub, skipLabel) {
  return new Promise(res => {
    const list = G.players.map((p, i) => ({ p, i })).filter(o => o.i !== ME && !o.p.out);
    openModal(`<h2>${esc(title)}</h2><p>${esc(sub)}</p>
      <div class="list">${list.map(o => `<button data-t="${o.i}"><span style="display:flex;gap:8px;align-items:center"><span class="ini">${initials(o.p.name)}</span>${esc(o.p.name)}</span><span class="mono">${t('cardsN', o.p.hand.length)}</span></button>`).join('')}</div>
      ${skipLabel ? `<button class="btn wide" id="skipT" style="margin-top:16px">${esc(skipLabel)}</button>` : ''}`);
    $('modalBody').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { SFX.play('click'); closeModal(); res(+b.dataset.t); });
    if (skipLabel) $('skipT').onclick = () => { SFX.play('click'); closeModal(); res(null); };
  });
}
// choose which matching cards go down together, and in what order; resolves to the cards, or null to cancel
function pickExtras(card, same) {
  return new Promise(res => {
    let order = same.slice(); // tap order = play order; the card you picked always goes first
    const draw = () => {
      const slot = (c, cls, num, k) => `<div class="slot">${num ? `<span class="ord">${num}</span>` : ''}${faceHTML(G.f(c), G.side, cls).replace('class="card', (k != null ? `data-k="${k}" ` : '') + 'class="card')}</div>`;
      openModal(`<h2>${t('togetherQ')}</h2><p>${t('togetherSub')}</p>
        <div class="pick">${slot(card, 'lead', 1, null)}${same.map((c, k) => { const at = order.indexOf(c); return slot(c, at >= 0 ? 'on' : 'off', at >= 0 ? at + 2 : 0, k); }).join('')}</div>
        <button class="btn primary wide" id="pxGo">${t('playN', order.length + 1)}</button>
        <button class="btn wide" id="pxClear" style="margin-top:8px">${order.length ? t('clearOrder') : t('selectAll')}</button>
        <button class="textlink" id="pxCancel">${t('cancel')}</button>`);
      $('modalBody').querySelectorAll('[data-k]').forEach(el => el.onclick = () => {
        const c = same[+el.dataset.k];
        order = order.includes(c) ? order.filter(x => x !== c) : order.concat(c);
        SFX.play('click'); draw();
      });
      $('pxClear').onclick = () => { order = order.length ? [] : same.slice(); draw(); };
      $('pxGo').onclick = () => { closeModal(); res(order); };
      $('pxCancel').onclick = () => { closeModal(); res(null); };
    };
    draw();
  });
}
function showEnd() {
  if (!G || G.winner === null || !$('modal').classList.contains('hidden') && $('modalBody').querySelector('#again,#menu')) return;
  const w = G.players[G.winner], meP = G.players[ME];
  const ranked = G.players.map((p, i) => ({ p, i })).sort((a, b) => (a.i === G.winner ? -1 : b.i === G.winner ? 1 : 0) || (a.p.elim - b.p.elim) || a.p.hand.length - b.p.hand.length);
  const won = G.winner === ME;
  const controls = !isHost
    ? `<p style="margin:16px 0 0">${t('waitNext')}</p><button class="textlink" id="menu">${t('leaveRoom')}</button>`
    : `<button class="btn primary wide" id="again">${t('playAgain')}</button><button class="textlink" id="menu">${t('backLobby')}</button>`;
  openModal(`<h2>${won ? t('youWin') : esc(t('wins', w.name))}</h2>
    <p>${won ? t('handEmptied') : t('finalCounts')}</p>
    <div class="list">${ranked.map((o, k) => `<div class="li"><span>${k + 1}. ${esc(o.p.name)}</span><span class="mono">${o.i === G.winner ? t('winner') : t('cardsN', o.p.hand.length)}</span></div>`).join('')}</div>
    ${controls}`);
  if ($('again')) $('again').onclick = () => { closeModal(); conn.send({ t: 'start' }); };
  $('menu').onclick = () => { closeModal(); if (isHost) conn.send({ t: 'tolobby' }); else leaveRoom(); };
}
function showRules() {
  openModal(`<h2>${t('howTo')}</h2><div class="rulestext">${RULES_HTML[LANG]}</div><button class="btn primary wide" id="closeR">${t('close')}</button>`);
  $('closeR').onclick = () => { closeModal(); if (G && G.winner !== null) showEnd(); };
}
