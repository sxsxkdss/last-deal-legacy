@keyframes psychoSplit {
  0% { filter: drop-shadow(4px 0 0 rgba(255, 0, 60, .75)) drop-shadow(-4px 0 0 rgba(0, 255, 240, .6)) brightness(1.2); translate: 6px 0; }
  14% { filter: drop-shadow(-7px 0 0 rgba(255, 0, 60, .8)) drop-shadow(6px 0 0 rgba(0, 255, 240, .65)) contrast(1.5); translate: -9px 2px; skew: -2deg 0deg; }
  28% { filter: brightness(.35) saturate(2); translate: 3px -1px; skew: 0deg 0deg; }
  42% { filter: drop-shadow(10px 0 0 rgba(255, 0, 60, .7)) drop-shadow(-9px 0 0 rgba(0, 255, 240, .6)) hue-rotate(-30deg); translate: -4px 0; }
  58% { filter: invert(.12) contrast(1.8); translate: 7px 1px; skew: 3deg 0deg; }
  72% { filter: drop-shadow(-3px 0 0 rgba(255, 0, 60, .6)) drop-shadow(3px 0 0 rgba(0, 255, 240, .5)); translate: -2px 0; skew: 0deg 0deg; }
  86%, 100% { filter: none; translate: 0 0; skew: 0deg 0deg; }
}
#psycho { position: fixed; inset: 0; z-index: 150; pointer-events: none; display: none; mix-blend-mode: screen; }
#psycho.on { display: block; animation: psychoFlash .56s steps(1); }
#psycho::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255, 20, 60, .16) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(255, 0, 50, .35)); }
#psycho i { position: absolute; left: -5%; right: -5%; background: linear-gradient(90deg, rgba(0, 255, 240, .5), rgba(255, 0, 80, .55) 40%, rgba(255, 255, 255, .35) 60%, rgba(0, 255, 240, .4)); animation: psychoTear .56s steps(1); }
#psycho i:nth-child(2) { animation-delay: .08s; } #psycho i:nth-child(3) { animation-delay: .17s; }
#psycho b { position: absolute; left: 50%; top: 46%; translate: -50% -50%; font: 700 clamp(18px, 3vw, 34px)/1 var(--f-type); letter-spacing: .2em; color: #ff2850; text-shadow: 3px 0 #00fff0, -3px 0 #ff0050; white-space: nowrap; animation: psychoText .56s steps(1); }
@keyframes psychoFlash { 0% { opacity: 1; } 20% { opacity: .4; } 35% { opacity: 1; } 60% { opacity: .2; } 75% { opacity: .9; } 100% { opacity: 0; } }
@keyframes psychoTear { 0% { transform: translateX(-12%) scaleY(1); opacity: .9; } 25% { transform: translateX(9%) scaleY(.4); } 50% { transform: translateX(-4%) scaleY(1.6); opacity: .6; } 75% { transform: translateX(14%); opacity: 0; } 100% { opacity: 0; } }
@keyframes psychoText { 0% { opacity: 0; } 15% { opacity: 1; translate: -52% -50%; } 35% { opacity: .3; translate: -47% -50%; } 50% { opacity: 1; translate: -50% -50%; } 80% { opacity: .8; } 100% { opacity: 0; } }
body.lite #psycho { display: none !important; }
.abbar, .invbar { justify-content: center; }

/* ---------- picking several cards in the hand ---------- */
#hand .card.sel { transform: translateY(calc(var(--dy, 0px) - 26px)) rotate(var(--rot, 0deg)); border-color: #f2e6cf; z-index: 50 !important; }
#hand .card.sel:hover { transform: translateY(calc(var(--dy, 0px) - 30px)) rotate(0deg) scale(1.04) var(--tilt, rotate(0deg)); }
.selbar { position: absolute; left: 50%; translate: -50% 0; z-index: 30; display: flex; align-items: center; gap: 8px; padding: 4px 8px; white-space: nowrap;
  background: #14100d var(--noise); background-blend-mode: overlay; border: 1px solid #3a2f24; border-radius: var(--ui-r); color: #d8cdb2; font: 600 12px/16px var(--f-type); }
.selbar.hidden { display: none; }
.selbar .sbN { font: 700 18px/1 var(--f-stamp); color: #f2e6cf; padding: 0 4px; border-right: 1px solid #3a2f24; }
.selbar b { font: 700 14px/16px var(--f-stamp); text-transform: uppercase; letter-spacing: .06em; color: #f2e6cf; }
.selbar b.bad, .selbar em.bad { color: #ff8a70; }
.selbar em { font-style: normal; color: #c9b98f; }

<script>

  discall: 'Discard All', skipall: 'Skip Everyone', wild: 'Wild', wd2: 'Wild Draw 2', wd4: 'Wild Draw 4',
  wrd4: 'Wild Reverse Draw 4', wd6: 'Wild Draw 6', wd10: 'Wild Draw 10', wrd8: 'Wild Reverse Draw 8',

  mirror: 'Mirror', shield: 'Vest', dflip: 'Eclipse', duel: 'Wild Duel', wd15: 'Wild Draw 15', bhole: 'Wild Pot',
  mul2: 'Wild Double Down', mul3: 'Wild Triple Down', lucky: 'Horseshoe', glass: 'Shot Glass', devil: '666', spin: 'Wild Jackpot', loan: 'Loan',
  gift: 'Tip', echo: 'Wild Encore', freeze: 'Handcuffs', interest: 'Interest', sacrifice: 'Wild Sacrifice', wheel: 'Wild Wheel', bomb: 'Shotgun',
  d6: 'Wild Redeal', pill: 'Scratch Card', tower: 'The Tower', glitch: 'Wild Glitch', brim: 'Wild Brimstone', foot: 'Collector', maze: 'Spinner', deal: 'Wild Contract', monstro: 'Wild All-In'
};
// ---------- Balatro combos: number cards played together in one drop ----------
// d = extra random cards you throw away, m = cards every opponent picks up (the big hands only)
const COMBOS = {
  // d: cards thrown away by day / slapped on the next player by night; m: everyone else picks up; r: debt the house forgives by day
  pair: { d: 0, m: 0, r: 2 }, twopair: { d: 1, m: 0, r: 4 }, three: { d: 1, m: 0, r: 4 }, straight: { d: 1, m: 0, r: 3 }, flush: { d: 2, m: 0, r: 8 },
  fullhouse: { d: 2, m: 1, r: 10 }, four: { d: 1, m: 1, r: 10 }, rainbow: { d: 2, m: 1, r: 12 }, straightflush: { d: 2, m: 2, r: 15 }, five: { d: 2, m: 2, r: 15 }

const COMBO_RANK = ['pair', 'twopair', 'three', 'straight', 'flush', 'fullhouse', 'four', 'rainbow', 'straightflush', 'five'];
// a plain Wild (no draw on it) can stand in for any number in a hand, one per hand
const isJoker = f => f && f.c === 'w' && f.v === 'wild';
function comboPlain(faces) {
  if (!faces || faces.length < 2 || faces.some(f => !/^\d$/.test(f.v) || f.c === 'w')) return null;
  const n = faces.length, nums = faces.map(f => +f.v), chips = nums.reduce((a, b) => a + b, 0);

  const oneColor = faces.every(f => f.c === faces[0].c);

// faces: [{c, v}] in play order. Returns { key, d, m, r, chips, mult } for a valid hand, null otherwise.
function comboOf(faces) {
  if (!faces || faces.length < 2) return null;
  const jokers = faces.filter(isJoker);

const EXTRA_CARDS = ['mirror', 'shield', 'dflip', 'wd15', 'mul2', 'mul3', 'lucky', 'glass', 'spin', 'loan', 'gift', 'echo', 'freeze', 'bomb', 'd6', 'pill', 'maze', 'deal'];

// ---- debt match: what a card left in your hand costs you at the end of a deal ----
function debtValue(f) {

}
// tokens sold in the shop; price in chips
// ---- deals: the angel (light, by day) and the demon (dark, by night). One active at a time, one of each per match. ----
const LIGHT_DEALS = ['rosary', 'candle', 'wind', 'halo', 'confess', 'alms', 'clean', 'grace', 'guardian', 'penance'];
const DARK_DEALS = ['double', 'usury', 'chains', 'blood', 'bail', 'devour', 'mark', 'drum', 'puppet', 'sharp'];

const ITEM_PRICE = { rent: 10, veil: 25, dawn: 25, shell: 25, oven: 25, eclipse: 25, twoface: 40, ward: 25 };

// ---- the Horsemen: once per match, when anyone's debt reaches 70% of their limit, one rides in for 10 table turns ----
const HORSEMEN = { death: ['curse'], war: ['timer', 'fury', 'arms'], famine: ['two', 'tithe'], plague: ['blank', 'rot'] };
const CURSES = ['dark', 'fever', 'mirror', 'static'];

const ATTACK_VALS = { L: ['d1', 'd2', 'd4'], D: ['d5'] };
// Lobby presets. Every rule key the server knows, every house card.
const RULE_ALL = ['flip', 'stacking', 'multi', 'combos', 'gamble', 'lastCall', 'potato', 'drawUntil', 'uno', 'chaos'];
const PRESETS = (() => {
  const on = (keys, all) => Object.fromEntries(all.map(k => [k, keys.includes(k)]));
  const base = ['flip', 'stacking', 'multi', 'drawUntil', 'uno', 'lastCall'];

const DRAW_VAL = { d1: 1, d2: 2, wd2: 2, d4: 4, wd4: 4, wrd4: 4, d5: 5, wd6: 6, wrd8: 8, wd10: 10, wd15: 15 };

const SIDE_WEIGHTS = {
  L: { colored: { '0': 2, '1': 4, '2': 4, '3': 4, '4': 4, '5': 4, '6': 4, '7': 4, '8': 4, '9': 4, skip: 2, rev: 2, d1: 2, d2: 2, flip: 2, d4: 1, discall: 2, skipall: 1, mirror: 1.5, shield: 1, dflip: 1, lucky: 1, glass: 1, loan: 1, gift: 1, pill: 1 },
       wild: { wild: 4, wd2: 2, wd4: 2, wrd4: 2, wd6: 1, wd10: 0.5, roul: 1.5, mul2: 1.5, spin: 2, echo: 2, d6: 1, swind: 0, sacr: 0 } },
  D: { colored: { '1': 4, '2': 4, '3': 4, '4': 4, '5': 4, '6': 4, '7': 4, '8': 4, '9': 4, skipall: 2, rev: 2, d5: 1.5, flip: 2, discall: 2, dflip: 1, glass: 1, freeze: 1, bomb: 1, maze: 1 },
       wild: { wild: 4, wdc: 2, wd6: 1.5, wd10: 1, wrd8: 1, roul: 1.5, wd15: 0.5, mul3: 1, deal: 1, swind: 0, sacr: 0 } }

const FACES = {}, FACE_W = {};
for (const s of ['L', 'D']) {

const ALPHA = (Array.from({ length: 92 }, (_, i) => String.fromCharCode(35 + i)).filter(ch => ch !== '\\').join('') + Array.from({ length: 95 }, (_, i) => String.fromCharCode(161 + i)).join(''));

let CARD_ID = 1;
const pick2 = list => list.slice().sort(() => Math.random() - 0.5).slice(0, 2);
// several deals can be held at once: up to 2 from the angel, up to 3 from the demon
const DEAL_MAX = { light: 2, dark: 3 };
function hasDeal(p, id) { return !!(p && p.deals && p.deals.includes(id)); }
function nLight(p) { return p && p.deals ? p.deals.filter(d => LIGHT_DEALS.includes(d)).length : 0; }
function nDark(p) { return p && p.deals ? p.deals.filter(d => DARK_DEALS.includes(d)).length : 0; }
function canLight(p) { return !p.fallen && nLight(p) < DEAL_MAX.light; }
// one deal signed per hand dealt: after that the visitors wait for the next deal
function offerOpen(p) { return !p.signedNow; }
function canDark(p) { return nDark(p) < DEAL_MAX.dark; }
const uniqueCard = v => ({ id: CARD_ID++, L: { c: 'w', v }, D: { c: 'w', v }, uniq: true });
function randFace(s) {
  const w = FACE_W[s]; let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < w.length; i++) if ((r -= w[i]) < 0) return Object.assign({}, FACES[s][i]);

const codeCard = code => ({ id: CARD_ID++, L: Object.assign({}, FACES.L[ALPHA.indexOf(code[0])]), D: Object.assign({}, FACES.D[ALPHA.indexOf(code[1])]) });
const other = s => s === 'L' ? 'D' : 'L';
function faceName(f) { return f.c === 'w' ? VALUE_NAME[f.v] : COLOR_NAME[f.c] + ' ' + (VALUE_NAME[f.v] || f.v); }

class Game {
  constructor(names, humans, rules) {
    rules = Object.assign({}, rules);
    this.rules = Object.assign({ stacking: true, drawUntil: true, seven: true, zero: true, multi: true, combos: true, gamble: true, lastCall: true, potato: true, revenge: true, snitch: true, finisher: true, jumpIn: true, mercy: 25, handSize: 7, uno: true, flip: true, chaos: true }, rules);
    // cut from the game: 7 swap, 0 rotate, jump-in, revenge, snitch, finisher
    Object.assign(this.rules, { jumpIn: false, revenge: false, snitch: false, finisher: false });

const RULES_HTML = {
  en: `<h3>Basics</h3><ul><li>Match the top card by color or symbol, or play a wild. Empty your hand to win.</li>
    <li>The deck never runs out. Cards come from a mix of classic, Flip and No Mercy cards.</li>
    <li>Tap a card or drag it to the pile. Keys: <b>D</b> or <b>Space</b> draw, <b>U</b> Last card, <b>P</b> pass.</li>
    <li>The host switches each rule and each extra card on or off in the lobby.</li></ul>
    <h3>Drawing</h3><ul><li>A stack you take and penalties come in automatically, one card at a time. Drawing until a color shows up (nothing to play, Color Roulette, Wild Draw Color) is by hand, one tap per card.</li>
    <li>While you owe cards, you can't play until they are picked up.</li></ul>
    <h3>Flip</h3><ul><li>Every card has a light side and a dark side. <b>Flip</b> turns every card over at once.</li>
    <li>You see the backs of other players' cards and of the next draw card, but not your own backs.</li>
    <li><b>Double Flip</b> turns the table for one turn. It flips back after the next player acts.</li></ul>
    <h3>Stacks</h3><ul><li>Answer a draw card with one of equal or higher value: +1, +2, +4, +5, +6, +8, +10, +15. If you can't, take the whole stack.</li>
    <li><b>Mirror</b> sends the whole stack back to whoever fed it last. <b>Shield</b> breaks the next stack that reaches you.</li></ul>
    <h3>Other rules</h3><ul>
    <li><b>Draw until color</b>: with nothing to play, draw one card at a time until you hit the current color or a wild.</li>
    <li><b>7</b> lets you swap hands with one player, or keep yours. <b>0</b> passes every hand along.</li>
    <li><b>Same-number drops</b>: play every card with the same number or symbol together, in the order you choose. Matching wilds go down together too (one color choice). Draw cards add up, skips skip that many players, and an even number of reverses or flips cancels out.</li>
    <li><b>Jump-in</b>: play an exact copy of the top card out of turn, wilds included (a Wild +4 on a Wild +4). Outlined cards qualify.</li>
    <li><b>Last card</b>: call it at two cards or right after dropping to one. If you're caught, you draw 2.</li></ul>
    <h3>Action cards</h3><ul>
    <li><b>Skip</b>, <b>Reverse</b>, <b>Skip Everyone</b> (you go again), <b>Discard All</b> (discard every card of that color).</li>
    <li><b>Color Roulette</b>: the next player names a color and draws until it appears.</li>
    <li><b>Wild Draw Color</b> (dark): you name the color; the next player draws until they hit it.</li>
    <li><b>Mult ×2 / ×3</b> (wild): multiplies the stack on the table, up to +60. With no stack, it arms the next draw card instead.</li>
    <li><b>Lucky</b>: 1 in 3 chance that two random cards leave your hand.</li>
    <li><b>Glass</b>: the next player picks up 2, but 1 in 4 it shatters and you pick them up.</li>
    <li><b>666</b> (dark wild): everyone else picks up 2, you pay 1.</li>
    <li><b>Jackpot</b> (wild): pulls the chaos lever immediately.</li>
    <li><b>Loan</b>: two random cards leave your hand now; after 3 more of your plays you pick up 4.</li>
    <li><b>Gift</b>: give 2 random cards to a player you pick.</li>

    <li>By day the extra cards leave your hand and the house forgives the debt; at night the next player picks up the extras and nothing is forgiven.</li></ul>

    <li>Пока вы должны карты, ходить нельзя.</li></ul>
    <h3>Стопки</h3><ul>
    <li>На карту «Возьми» отвечайте такой же или старше: +1, +2, +4, +5, +6, +8, +10, +15. Нечем — забирайте всю стопку.</li>

    <li><b>Русская рулетка</b>: перед достаточно большой стопкой нажмите «Рулетка»: 50% — стопка исчезает и ход уходит дальше, 50% — берёте её вдвойне.</li>
</ul>
    <h3>Покерные комбинации</h3><ul>
    <li><b>Как выбрать</b>: правый клик по картам (или Ctrl/Shift+клик, или кнопка <b>Выбрать несколько</b> и тапы). Над рукой появляется панель с комбинацией и выплатой; жмите «Сыграть», кликните по сбросу или перетащите выбранную карту на него. Обычный клик по-прежнему играет одну карту. Панель подсказывает лучшую комбинацию в руке.</li>
    <li>Комбинации собираются из цифр; один простой <b>Джокер</b> может заменить любую цифру. Ведёт первая карта, которая подходит к сбросу; последняя задаёт цвет.</li>
    <li><b>Пара</b>: долг −2. <b>Две пары</b>, <b>Сет</b>: 1 лишняя карта, долг −4. <b>Стрит</b> (3+ подряд одного цвета): по 1 лишней за каждую сверх двух, долг −3 за каждую. <b>Флеш</b> (5+ одного цвета): 2 лишние, долг −8. <b>Фулл-хаус</b>: 2 лишние, всем остальным +1, долг −10.</li>
    <li><b>Каре</b>: 1 лишняя, всем остальным +1, долг −10. <b>Радуга</b> (одна цифра всех четырёх цветов): 2 лишние, всем +1, долг −12. <b>Покер</b> (5 одинаковых), <b>Стрит-флеш</b>: 2 лишние, всем +2, долг −15.</li>
    <li>Днём лишние карты уходят из руки и дом прощает долг; ночью лишние берёт следующий игрок, а долг не прощается.</li></ul>
    <h3>Правила стола</h3><ul>
    <li><b>Сброс одинаковых</b>: все карты с одним символом вместе.</li>
    <li><b>«Одна»</b>: крикните на двух картах или сразу после того, как осталась одна. Поймали — берёте 2.</li>
    <li><b>Последний звонок</b>: через 250 ходов дом закрывает стол, и побеждает тот, у кого меньше всего карт. Последние 30 ходов стол отсчитывает вслух.</li></ul>
    <h3>Карты Дома</h3><ul>
    <li><b>Удача</b>: Подкова (1 к 3: две карты уходят), Лотерейка (случайный выигрыш или проигрыш), Джекпот (рычаг слотов сразу), Пересдача (новая рука).</li>
    <li><b>Деньги</b>: Займ (две карты уходят сейчас, четыре — через 3 хода), Чаевые (отдать 2 карты), Контракт (половина руки уходит, следующая стопка вдвойне).</li>

// ===== ASSETS: an optional pack of card sprites, fonts, sounds and a background, loaded from /assets =====
// Anything missing falls back to the built-in look and synthesized sounds. See template/README.md.
const ASSETS = (() => {
  let man = null, cfg = {}, ready = false;
  const cards = new Set();
  const sounds = {};      // name -> [file]
  const buffers = {};     // file -> AudioBuffer | 'loading' | 'bad'
  // (music lives in the crossfading decks below)
  const keyOf = (f, side) => `${side}-${f.c}-${f.v}`;
  const cls = k => 'spr-' + k.replace(/[^a-z0-9-]/gi, '_');
  function cardClass(f, side) { const k = keyOf(f, side); return cards.has(k) ? cls(k) : ''; }
  function css(text) { const s = document.createElement('style'); s.textContent = text; document.head.appendChild(s); }

  // the room's music is only decided once we know whether the pack has a music file
  const settle = () => { ready = true; if (typeof AMB !== 'undefined') AMB.apply(); };
  async function load() {
    try { const r = await fetch('assets/manifest.json', { cache: 'no-cache' }); if (!r.ok) return settle(); man = await r.json(); } catch (e) { return settle(); }
    cfg = man.config || {};
    const rules = [];
    // cards: assets/cards/<side>-<color>-<value>.png, e.g. L-r-7.png, D-w-bhole.png
    for (const file of man.cards || []) {
      const k = file.replace(/\.[^.]+$/, '');
      if (!/^[LD]-[a-z]-[a-z0-9]+$/i.test(k)) continue;
      cards.add(k); rules.push(`.${cls(k)}{background-image:url("assets/cards/${encodeURIComponent(file)}")}`);
    }
    if (cards.size) rules.push(`.card.spr{background-color:transparent;background-position:center;background-size:100% 100%;background-repeat:no-repeat;border:0;border-radius:${cfg.cardRadius ?? 0}px;box-shadow:none${cfg.pixelated ? ';image-rendering:pixelated' : ''}}`,
      `.card.spr .oval,.card.spr .cor,.card.spr .suit,.card.spr::before,.card.spr::after{display:none}`);

// 'house' = a synthesized back-room hum (or the asset pack's music file), 'youtube' = a YouTube video playing hidden.
const AMB = {
  nodes: null, yt: null, side: 'L',
  YT: 'a8P8ATq9eFA',
  ytId(url) { const m = String(url || '').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(url || '') ? url : 'hFBn_Ro9y7I'); },
  // the room's music: a music file from the asset pack if there is one, otherwise the YouTube track
  apply() {

    // never start YouTube before we know there's no music file, or both play (and YouTube starts at full volume)
    if (!S.sound || S.ambient === 'off' || pack || !ASSETS.ready) { this.stopYT(); return; }

  },
  // a low drone, a slow murmur and vinyl crackle; brighter by day, heavier at night
  startHouse() {

    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.connect(out);

    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 140; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const mur = c.createBufferSource(); mur.buffer = SFX.noise; mur.loop = true;
    const mf = c.createBiquadFilter(); mf.type = 'bandpass'; mf.frequency.value = 520; mf.Q.value = 0.8;
    const mg = c.createGain(); mg.gain.value = 0.05; mur.connect(mf); mf.connect(mg); mg.connect(out); mur.start();
    const crackle = setInterval(() => { if (!this.nodes || !S.sound) return; if (Math.random() < 0.5) SFX.rustle(c.currentTime + Math.random() * 0.2, 0.01, 3000 + Math.random() * 3000, 2000, 4, 0.03 * (S.ambVol ?? 0.35)); }, 180);

    f.allow = 'autoplay; encrypted-media'; f.title = 'ambient'; f.tabIndex = -1;

function showSettings() {
  const seg = (id, val, opts) => `<div class="seg" id="${id}">${opts.map(([v, label]) => `<button data-v="${v}" class="${String(val) === String(v) ? 'on' : ''}">${label}</button>`).join('')}</div>`;
  const slider = (id, val) => `<input type="range" id="${id}" min="0" max="100" value="${Math.round((val ?? 0.5) * 100)}">`;
  openModal(`<h2>${t('settings')}</h2><div class="settings">
    <div class="set"><span>${t('menuLang')}</span>${seg('stLang', LANG, Object.entries(LANGS))}</div>
    <div class="set"><span>${t('setSound')}</span>${seg('stSound', S.sound ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    <div class="set"><span>${t('setVolume')}</span>${slider('stVol', S.vol)}</div>
    <div class="set"><span>${t('setAmbient')}</span>${seg('stAmb', S.ambient === 'off' ? 'off' : 'on', [['on', t('on')], ['off', t('off')]])}</div>
    <div class="set"><span>${t('setAmbVol')}</span>${slider('stAmbVol', S.ambVol)}</div>
    <div class="set"><span>${t('menuFx')}</span>${seg('stFx', S.fx, [['full', t('fxFull')], ['lite', t('fxLite')]])}</div>
    <div class="set"><span>${t('setMusicFx')}</span>${seg('stMusicFx', S.musicFx !== false ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    <div class="set"><span>${t('setShake')}</span>${seg('stShake', S.shake !== false ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    <div class="set"><span>${t('setBg')}</span>${seg('stBg', S.bgMotion !== false ? 1 : 0, [[1, t('bgMoving')], [0, t('bgStill')]])}</div>
    <div class="set"><span>${t('setTips')}</span>${seg('stTips', S.tips !== false ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>
    ${S.cactusFound ? `<div class="set cactusset"><span>${t('setCactus')}</span>${seg('stCactus', S.cactus ? 1 : 0, [[1, t('on')], [0, t('off')]])}</div>` : ''}
  </div><button class="btn primary wide" id="stClose" style="margin-top:16px">${t('close')}</button>`);
  const bindSeg = (id, fn) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { fn(b.dataset.v); SFX.play('click'); showSettings(); });
  bindSeg('stLang', v => setLang(v));
  bindSeg('stSound', v => { S.sound = v === '1'; saveSettings(); if (S.sound) SFX.init(); $('btnSound').textContent = S.sound ? t('soundOn') : t('soundOff'); AMB.apply(); });
  bindSeg('stAmb', v => { S.ambient = v; saveSettings(); SFX.init(); AMB.apply(); });
  bindSeg('stFx', v => setFx(v));
  bindSeg('stShake', v => { S.shake = v === '1'; saveSettings(); });
  bindSeg('stMusicFx', v => { S.musicFx = v === '1'; saveSettings(); });
  bindSeg('stBg', v => { S.bgMotion = v === '1'; saveSettings(); });
  bindSeg('stTips', v => { S.tips = v === '1'; saveSettings(); });
  if ($('stCactus')) bindSeg('stCactus', v => { S.cactus = v === '1'; saveSettings(); drawCactus(); });
  // the secret: knock on the title five times
  let knocks = 0; const h2 = $('modalBody').querySelector('h2');
  if (h2 && !S.cactusFound) h2.onclick = () => { if (++knocks >= 5) { S.cactusFound = true; S.cactus = true; saveSettings(); SFX.play('lucky'); drawCactus(); showSettings(); toast(t('cactusFound')); } else SFX.play('tick'); };
  $('stVol').oninput = e => { S.vol = e.target.value / 100; saveSettings(); if (SFX.master) SFX.master.gain.value = 0.9 * S.vol; };
  $('stVol').onchange = () => SFX.play('stack', 6);
  $('stAmbVol').oninput = e => { S.ambVol = e.target.value / 100; saveSettings(); AMB.volume(); };
  $('stClose').onclick = closeModal;
}
